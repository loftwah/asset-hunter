<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Match-cut plate: two shots cut on a matched screen-space motion vector" role="img" viewBox="0 0 800 1000"><defs><clipPath id="frameA"><rect width="292" height="328" x="72" y="150"/></clipPath><clipPath id="frameB"><rect width="292" height="328" x="436" y="150"/></clipPath><marker id="cut" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#ff5a1f" d="M0 0 L9 4 L0 8 Z"/></marker></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="72" fill="#ff5a1f" letter-spacing="2">CUT ON THE VECTOR</text><text x="72" y="92" fill="#6a7178">not on the eyeline, not on the cut</text></g><g clip-path="url(#frameA)"><rect width="292" height="328" x="72" y="150" fill="#141a1f"/><g stroke="#1e262c"><path d="M72 214 H364 M72 278 H364 M72 342 H364 M72 406 H364"/><path d="M148 150 V478 M224 150 V478 M300 150 V478"/></g><g opacity=".55"><rect width="140" height="96" x="150" y="248" fill="#ff5a1f" opacity=".2"/><rect width="200" height="64" x="120" y="264" fill="#ff5a1f" opacity=".12"/><rect width="260" height="30" x="92" y="284" fill="#ff5a1f" opacity=".07"/></g><rect width="76" height="80" x="212" y="256" fill="#ffb27a" opacity=".85"/><path stroke="#ff5a1f" stroke-width="2" d="M212 256 L150 268 M212 296 L146 306 M288 256 L350 268 M288 296 L354 306" opacity=".7"/><path stroke="#ff5a1f" stroke-width="3" marker-end="url(#cut)" d="M288 296 L330 372"/></g><rect width="292" height="328" x="72" y="150" fill="none" stroke="#23272c"/><g clip-path="url(#frameB)"><rect width="292" height="328" x="436" y="150" fill="#1a1519"/><g stroke="#241d22"><path d="M436 214 H728 M436 278 H728 M436 342 H728 M436 406 H728"/><path d="M512 150 V478 M588 150 V478 M664 150 V478"/></g><g opacity=".5"><path fill="#a68bfb" d="M436 470 L728 400 L728 478 L436 478 Z" opacity=".18"/></g><circle cx="580" cy="300" r="52" fill="#c8b6ff" opacity=".8"/><path stroke="#a68bfb" stroke-width="2" d="M528 300 L462 300 M632 300 L698 300" opacity=".7"/><path stroke="#ff5a1f" stroke-width="3" marker-end="url(#cut)" d="M632 300 L662 372"/></g><rect width="292" height="328" x="436" y="150" fill="none" stroke="#23272c"/><g><path stroke="#ff5a1f" stroke-dasharray="4 4" stroke-width="1.5" d="M340 300 L436 300" opacity=".7"/><path fill="#ff5a1f" d="M330 296 L344 300 L330 304 Z"/><text x="388" y="288" fill="#ff5a1f" font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">Δ 1px/frame</text><text x="388" y="326" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">same</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="522" fill="#8b929a">motion vector matched: the cut is invisible</text><text x="72" y="552" fill="#8b929a">framing differs, palette differs, subject differs</text><text x="72" y="582" fill="#4fce8a">perceived continuity comes from velocity, not identity</text></g><g><rect width="656" height="180" x="72" y="620" fill="#0c0f12" stroke="#1e2429" rx="3"/><g stroke="#23272c"><path d="M72 656 H728 M72 692 H728 M72 728 H728 M72 764 H728"/><path d="M136 620 V800 M200 620 V800 M264 620 V800 M328 620 V800 M392 620 V800 M456 620 V800 M520 620 V800 M584 620 V800 M648 620 V800 M712 620 V800"/></g><g fill="none" stroke="#ff5a1f" stroke-width="2"><path d="M72 674 L136 674 L200 686 L264 698 L328 704 L392 704 L456 698 L520 686 L584 674 L648 674 L728 662"/></g><text x="88" y="646" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="15">per-frame displacement of the tracked feature</text><text x="712" y="790" fill="#4d565f" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="end">frame index</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="846" fill="#f4f2ee">Match the velocity, and the seam disappears.</text><text x="72" y="878" fill="#6a7178">Matching the subject only gets you most of the way there.</text><text x="72" y="918" fill="#4d565f">cost: the cut can no longer be motivated by story.</text></g></svg>