<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Match-cut plate: two shots cut on a matched screen-space motion vector">
	<defs>
		<clipPath id="frameA"><rect x="72" y="150" width="292" height="328"/></clipPath>
		<clipPath id="frameB"><rect x="436" y="150" width="292" height="328"/></clipPath>
		<marker id="cut" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
			<path d="M0 0 L9 4 L0 8 Z" fill="#ff5a1f"/>
		</marker>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="72" fill="#ff5a1f" letter-spacing="2">CUT ON THE VECTOR</text>
		<text x="72" y="92" fill="#6a7178">not on the eyeline, not on the cut</text>
	</g>

	<!-- shot A: a form travelling right, blur trailing left -->
	<g clip-path="url(#frameA)">
		<rect x="72" y="150" width="292" height="328" fill="#141a1f"/>
		<g stroke="#1e262c">
			<path d="M72 214 H364 M72 278 H364 M72 342 H364 M72 406 H364"/>
			<path d="M148 150 V478 M224 150 V478 M300 150 V478"/>
		</g>
		<g opacity=".55">
			<rect x="150" y="248" width="140" height="96" fill="#ff5a1f" opacity=".2"/>
			<rect x="120" y="264" width="200" height="64" fill="#ff5a1f" opacity=".12"/>
			<rect x="92" y="284" width="260" height="30" fill="#ff5a1f" opacity=".07"/>
		</g>
		<rect x="212" y="256" width="76" height="80" fill="#ffb27a" opacity=".85"/>
		<path d="M212 256 L150 268 M212 296 L146 306 M288 256 L350 268 M288 296 L354 306" stroke="#ff5a1f" stroke-width="2" opacity=".7"/>
		<path d="M288 296 L330 372" stroke="#ff5a1f" stroke-width="3" marker-end="url(#cut)"/>
	</g>
	<rect x="72" y="150" width="292" height="328" fill="none" stroke="#23272c"/>

	 <!-- shot B: a different subject, same vector -->
	<g clip-path="url(#frameB)">
		<rect x="436" y="150" width="292" height="328" fill="#1a1519"/>
		<g stroke="#241d22">
			<path d="M436 214 H728 M436 278 H728 M436 342 H728 M436 406 H728"/>
			<path d="M512 150 V478 M588 150 V478 M664 150 V478"/>
		</g>
		<g opacity=".5">
			<path d="M436 470 L728 400 L728 478 L436 478 Z" fill="#a68bfb" opacity=".18"/>
		</g>
		<circle cx="580" cy="300" r="52" fill="#c8b6ff" opacity=".8"/>
		<path d="M528 300 L462 300 M632 300 L698 300" stroke="#a68bfb" stroke-width="2" opacity=".7"/>
		<path d="M632 300 L662 372" stroke="#ff5a1f" stroke-width="3" marker-end="url(#cut)"/>
	</g>
	<rect x="436" y="150" width="292" height="328" fill="none" stroke="#23272c"/>

	<!-- the matched vector, drawn once, spanning both frames -->
	<g>
		<path d="M340 300 L436 300" stroke="#ff5a1f" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
		<path d="M330 296 L344 300 L330 304 Z" fill="#ff5a1f"/>
		<text x="388" y="288" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#ff5a1f" text-anchor="middle">Δ 1px/frame</text>
		<text x="388" y="326" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178" text-anchor="middle">same</text>
	</g>

	<!-- why it reads as one continuous move -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="16">
		<text x="72" y="522" fill="#8b929a">motion vector matched: the cut is invisible</text>
		<text x="72" y="552" fill="#8b929a">framing differs, palette differs, subject differs</text>
		<text x="72" y="582" fill="#4fce8a">perceived continuity comes from velocity, not identity</text>
	</g>

	<!-- the measurement grid the match is solved on -->
	<g>
		<rect x="72" y="620" width="656" height="180" rx="3" fill="#0c0f12" stroke="#1e2429"/>
		<g stroke="#23272c">
			<path d="M72 656 H728 M72 692 H728 M72 728 H728 M72 764 H728"/>
			<path d="M136 620 V800 M200 620 V800 M264 620 V800 M328 620 V800 M392 620 V800 M456 620 V800 M520 620 V800 M584 620 V800 M648 620 V800 M712 620 V800"/>
		</g>
		<g stroke="#ff5a1f" stroke-width="2" fill="none">
			<path d="M72 674 L136 674 L200 686 L264 698 L328 704 L392 704 L456 698 L520 686 L584 674 L648 674 L728 662"/>
		</g>
		<text x="88" y="646" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6a7178">per-frame displacement of the tracked feature</text>
		<text x="712" y="790" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#4d565f" text-anchor="end">frame index</text>
	</g>

	<g font-family="ui-monospace,Menlo,monospace" font-size="16">
		<text x="72" y="846" fill="#f4f2ee">Match the velocity, and the seam disappears.</text>
		<text x="72" y="878" fill="#6a7178">Matching the subject only gets you most of the way there.</text>
		<text x="72" y="918" fill="#4d565f">cost: the cut can no longer be motivated by story.</text>
	</g>
</svg>
