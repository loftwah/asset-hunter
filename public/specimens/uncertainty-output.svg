<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Uncertainty visualisation plate: a model answer with its confidence shown as first-class output">
	<defs>
		<pattern id="hatchA" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
			<line x1="0" y1="0" x2="0" y2="8" stroke="#ff5a1f" stroke-width="2" opacity=".5"/>
		</pattern>
		<pattern id="hatchB" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
			<line x1="0" y1="0" x2="0" y2="6" stroke="#f2a33c" stroke-width="1.4" opacity=".38"/>
		</pattern>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="72" fill="#ff5a1f" letter-spacing="2">CONFIDENCE AS CONTENT</text>
		<text x="728" y="72" text-anchor="end">not a disclaimer below the fold</text>
	</g>

	<!-- the answer, with the weak clause marked in place -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="26" fill="#f4f2ee">
		<text x="72" y="150">Use a</text>
		<text x="196" y="150" fill="#4fce8a">fixed</text>
		<text x="272" y="150"> lower-third</text>
		<text x="472" y="150" fill="#4fce8a">recessive</text>
		<text x="614" y="150"> plate.</text>

		<text x="72" y="212">Reserve</text>
		<text x="192" y="212" fill="#4fce8a">true</text>
		<text x="262" y="212"> vignette</text>
		<text x="420" y="212" fill="#4fce8a">depth</text>
		<text x="500" y="212"> for the</text>
		<text x="620" y="212"> HUD only.</text>
	</g>

	<!-- the weak clause: hedged, so it is textured as well as coloured -->
	<g>
		<rect x="72" y="248" width="656" height="132" rx="3" fill="url(#hatchB)"/>
		<rect x="72" y="248" width="656" height="132" rx="3" fill="none" stroke="#f2a33c" stroke-opacity=".5" stroke-dasharray="5 5"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#d8c39c">
			<text x="88" y="286">Avoid a glow on the plate —</text>
			<text x="88" y="322" fill="#f2a33c">only 3 of 41 examples show this,</text>
			<text x="88" y="358" fill="#f2a33c">and it may be incidental.</text>
		</g>
		<g font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#f2a33c">
			<text x="712" y="286" text-anchor="end">n=3 / 41</text>
			<text x="712" y="312" text-anchor="end">low support</text>
			<text x="712" y="338" text-anchor="end">under review</text>
		</g>
	</g>

	<!-- the strong clause: quiet, because confidence should not shout -->
	<g>
		<rect x="72" y="404" width="656" height="86" rx="3" fill="#0f1310" stroke="#1f2a22"/>
		<rect x="72" y="404" width="3" height="86" fill="#4fce8a"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#cfe6d8">
			<text x="92" y="440">Fixed plates recur in 29 of 41 HUD examples.</text>
			<text x="92" y="474" fill="#6a7178">held by 11 distinct sources</text>
		</g>
		<text x="712" y="440" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4fce8a" text-anchor="end">n=29 / 41</text>
		<text x="712" y="474" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178" text-anchor="end">multi-source</text>
	</g>

	<!-- the mechanism: coverage, stated numerically and visually -->
	<g>
		<path d="M72 540 H728" stroke="#1c2126"/>
		<text x="72" y="582" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">coverage</text>
		<g>
			<rect x="176" y="568" width="200" height="18" fill="#141a16"/>
			<rect x="176" y="568" width="141" height="18" fill="#4fce8a" opacity=".8"/>
			<text x="392" y="582" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4fce8a">29</text>
		</g>
		<g>
			<rect x="452" y="568" width="200" height="18" fill="#1a1409"/>
			<rect x="452" y="568" width="15" height="18" fill="#f2a33c" opacity=".85"/>
			<text x="668" y="582" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#f2a33c">3</text>
		</g>
		<g font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">
			<text x="72" y="640">novelty</text>
			<rect x="176" y="626" width="476" height="4" fill="#141a16"/>
			<rect x="176" y="626" width="476" height="4" fill="#a68bfb" opacity=".7"/>
			<text x="668" y="640" fill="#a68bfb">0.91</text>
		</g>
	</g>

	<!-- the rule -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="17">
		<text x="72" y="712" fill="#f4f2ee">Never let a weak claim render as if it were strong.</text>
		<text x="72" y="748" fill="#6a7178">Confidence is shown by texture, weight and count —</text>
		<text x="72" y="778" fill="#6a7178">never by colour alone.</text>
		<text x="72" y="820" fill="#4d565f">machine evidence stays separate from editorial judgement.</text>
	</g>

	<g>
		<rect x="72" y="864" width="656" height="1" fill="#1c2126"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4d565f">
			<text x="72" y="900">hatched = insufficient support · outline = awaiting verification</text>
			<text x="728" y="900" text-anchor="end">tap any claim for its source list</text>
		</g>
	</g>
</svg>
