<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Wordmark plate: a tracked-out wordmark, with the tracking value called out" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><text x="0" y="44.8" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="147.2" font-weight="600" letter-spacing="-7.68" text-anchor="middle" transform="translate(400,300)">KERNEL</text></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="23" text-anchor="middle">the only decision is the space between the letters</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><text x="0" y="14" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="46" font-weight="600" letter-spacing="-2.4" text-anchor="middle" transform="translate(190,712)">KERNEL</text></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><text x="0" y="8.12" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="26.68" font-weight="600" letter-spacing="-1.392" text-anchor="middle" transform="translate(400,724)">KERNEL</text></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><text x="0" y="4.48" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="14.72" font-weight="600" letter-spacing="-.768" text-anchor="middle" transform="translate(610,734)">KERNEL</text></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="18">Tracking is one number, applied per gap, not globally.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="17">Text zoom breaks it first, so state the large-text setting.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: one word · one tracking</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="17" text-anchor="end">breaks at zoom under 1.4×</text></svg>