<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" data-bleed="floor" role="img" aria-label="Raymarched signed-distance-field plate: a scene defined entirely as distance functions">
	<defs>
		<linearGradient id="sdfbg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#150e1c"/>
			<stop offset="55%" stop-color="#0a0b10"/>
			<stop offset="100%" stop-color="#08090a"/>
		</linearGradient>
		<filter id="sdfglow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="16"/>
		</filter>
		<filter id="sdfsoft" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="2.4"/>
		</filter>
	</defs>
	<rect width="800" height="1000" fill="url(#sdfbg)"/>

	<!-- glow pass: emissive surfaces accumulate before the surface pass -->
	<g filter="url(#sdfglow)" opacity=".8">
		<ellipse cx="400" cy="470" rx="150" ry="150" fill="#ff5a1f" opacity=".38"/>
		<ellipse cx="400" cy="620" rx="230" ry="70" fill="#a68bfb" opacity=".26"/>
	</g>

	<!-- the scene: a sphere, a floor and a torus, all as SDFs -->
	<g filter="url(#sdfsoft)">
		<!-- floor: plane, shaded by distance falloff -->
		<rect x="0" y="612" width="800" height="388" fill="#0c0d13"/>
		<path d="M0 612 H800 V648 H0Z" fill="#151021"/>
		<g stroke="#ff5a1f" stroke-opacity=".22">
			<path d="M400 616 L-260 1000 M400 616 L60 1000 M400 616 L400 1000 M400 616 L740 1000 M400 616 L1060 1000"/>
		</g>
		<g stroke="#ff5a1f" stroke-opacity=".14">
			<path d="M0 664 H800 M0 736 H800 M0 830 H800 M0 948 H800"/>
		</g>

		<!-- torus: bent around the sphere -->
		<ellipse cx="400" cy="500" rx="238" ry="238" fill="none" stroke="#a68bfb" stroke-width="13" stroke-opacity=".8"/>
		<ellipse cx="400" cy="500" rx="238" ry="238" fill="none" stroke="#f2c9ff" stroke-width="3" stroke-opacity=".5"/>

		<!-- sphere: lit by a single directional term -->
		<circle cx="400" cy="500" r="148" fill="#2a1408"/>
		<circle cx="400" cy="500" r="148" fill="#ff5a1f" opacity=".22"/>
		<path d="M400 352 a148 148 0 0 1 104 42 a186 186 0 0 0 -208 0 a148 148 0 0 1 104 -42 Z" fill="#ffb27a" opacity=".55"/>
		<circle cx="352" cy="444" r="42" fill="#ffd9b8" opacity=".38"/>
	</g>

	<!-- step count readout: the honest cost of the technique -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">
		<text x="72" y="80" fill="#a68bfb" letter-spacing="2">RAYMARCH · 96 STEPS MAX</text>
		<text x="72" y="100" fill="#6a7178">no mesh · no texture · no vertex buffer</text>
	</g>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17">
		<text x="72" y="920" fill="#6a7177">sphere(p, c, r)   →  distance to surface, everywhere</text>
		<text x="72" y="952" fill="#4d565f">union · subtract · smooth-min</text>
		<text x="728" y="952" text-anchor="end" fill="#4fce8a">edit the function, not the model</text>
	</g>
</svg>
