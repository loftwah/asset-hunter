<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Command palette plate: a single omnibar overriding conventional navigation">
	<defs>
		<linearGradient id="cpal" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#161b21"/>
			<stop offset="100%" stop-color="#0c0e11"/>
		</linearGradient>
		<filter id="cblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>
	<!-- the application it overrides, pushed back in value only -->
	<g opacity=".2" fill="#2b323a">
		<rect x="64" y="92" width="150" height="14" rx="2"/>
		<rect x="64" y="126" width="104" height="14" rx="2"/>
		<rect x="64" y="196" width="672" height="1"/>
		<rect x="64" y="222" width="672" height="96" rx="4"/>
		<rect x="64" y="338" width="672" height="96" rx="4"/>
		<rect x="64" y="454" width="672" height="96" rx="4"/>
	</g>
	<!-- scrim, not a blur of content: focus is the mechanism -->
	<rect width="800" height="1000" fill="#08090a" opacity=".72"/>
	<ellipse cx="400" cy="452" rx="330" ry="180" fill="#ff5a1f" opacity=".1" filter="url(#cblur)"/>

	<!-- the omnibar -->
	<rect x="96" y="316" width="608" height="76" rx="6" fill="url(#cpal)" stroke="#343b42"/>
	<rect x="96" y="316" width="608" height="76" rx="6" fill="none" stroke="#ff5a1f" stroke-opacity=".5"/>
	<g stroke="#8b929a" stroke-width="2" stroke-linecap="round" fill="none">
		<circle cx="132" cy="354" r="11"/>
		<path d="M140 362 L150 372"/>
	</g>
	<text x="170" y="363" font-family="ui-monospace,Menlo,monospace" font-size="27" fill="#f4f2ee">ship</text>
	<rect x="234" y="331" width="3" height="46" fill="#ff5a1f"/>
	<text x="248" y="363" font-family="ui-monospace,Menlo,monospace" font-size="27" fill="#8b929a">…</text>

	<!-- ranked results: type carries meaning, not chrome -->
	<g font-family="ui-monospace,Menlo,monospace">
		<rect x="96" y="404" width="608" height="1" fill="#23272c"/>
		<g>
			<rect x="96" y="405" width="4" height="66" fill="#ff5a1f"/>
			<text x="128" y="436" font-size="26" fill="#f4f2ee">Rebuild staging bundle</text>
			<text x="128" y="462" font-size="18" fill="#6a7178">deploy · target=preview</text>
			<text x="672" y="448" font-size="18" fill="#8b929a" text-anchor="end">⏎</text>
		</g>
		<rect x="96" y="472" width="608" height="1" fill="#23272c"/>
		<g>
			<rect x="96" y="473" width="4" height="66" fill="#23272c"/>
			<text x="128" y="504" font-size="26" fill="#b6bcc3">Shiproom.deployments</text>
			<text x="128" y="530" font-size="18" fill="#6a7178">collection · 4 records</text>
			<text x="672" y="516" font-size="18" fill="#4d565f" text-anchor="end">⇥</text>
		</g>
		<rect x="96" y="540" width="608" height="1" fill="#23272c"/>
		<g>
			<rect x="96" y="541" width="4" height="66" fill="#23272c"/>
			<text x="128" y="572" font-size="26" fill="#b6bcc3">Ship a new asset pack</text>
			<text x="128" y="598" font-size="18" fill="#6a7178">action · opens hunt brief</text>
			<text x="672" y="584" font-size="18" fill="#4d565f" text-anchor="end">⇥</text>
		</g>
		<rect x="96" y="608" width="608" height="1" fill="#23272c"/>
	</g>

	<!-- footer hint strip -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="96" y="654">↑↓ move</text>
		<text x="704" y="654" text-anchor="end">esc dismiss</text>
	</g>

	<!-- the nav bar it replaced, ghosted at the very bottom -->
	<g opacity=".16">
		<rect x="96" y="884" width="608" height="1" fill="#343b42"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#8b929a">
			<text x="96" y="924">Catalogue</text>
			<text x="252" y="924">Verticals</text>
			<text x="408" y="924">Licensing</text>
			<text x="560" y="924">About</text>
		</g>
	</g>
</svg>
