<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Lettermark plate: the counter of a letter, lifted out and filled as the mark" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><path fill="#ff5a1f" d="M0 -50 L62 -50 L100 0 L62 50 L0 50 Z" transform="translate(400,300)"/></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="22" text-anchor="middle">the letter is the source; the counter is the artwork</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><path fill="#ff5a1f" d="M0 -50 L62 -50 L100 0 L62 50 L0 50 Z" transform="translate(190,712)"/></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><path fill="#ff5a1f" d="M0 -50 L62 -50 L100 0 L62 50 L0 50 Z" transform="translate(400,724)"/></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><path fill="#ff5a1f" d="M0 -50 L62 -50 L100 0 L62 50 L0 50 Z" transform="translate(610,734)"/></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="19">Two radii meeting at a point is what holds the shape.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="16">A counter narrower than the stroke stops being a mark at 20px.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: one shape · reverse</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="end">breaks when the counter tightens</text></svg>