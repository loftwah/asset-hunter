<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Event-sourced core plate: an append-only fact stream projecting into two different read models">
	<defs>
		<marker id="esArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0 0 L6 3 L0 6 Z" fill="#4cc2f0"/>
		</marker>
		<marker id="esArrowO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0 0 L6 3 L0 6 Z" fill="#ff5a1f"/>
		</marker>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="72" fill="#ff5a1f" letter-spacing="2">APPEND-ONLY FACTS</text>
		<text x="72" y="92" fill="#6a7178">writes never mutate; reads are derived</text>
	</g>

	<!-- the log: the only source of truth -->
	<g>
		<rect x="72" y="104" width="248" height="520" rx="4" fill="#0d1013" stroke="#23272c"/>
		<path d="M84 104 V624" stroke="#ff5a1f" stroke-opacity=".35" stroke-width="2"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="16">
			<g><circle cx="84" cy="150" r="4" fill="#ff5a1f"/><text x="104" y="156" fill="#b6bcc3">01</text><text x="140" y="156" fill="#f4f2ee">hunt.created</text><text x="104" y="176" fill="#6a7178">brief={vertical:games}</text></g>
			<g><circle cx="84" cy="222" r="4" fill="#ff5a1f"/><text x="104" y="228" fill="#b6bcc3">02</text><text x="140" y="228" fill="#f4f2ee">candidate.found</text><text x="104" y="248" fill="#6a7178">repo=…/shader-toy</text></g>
			<g><circle cx="84" cy="294" r="4" fill="#ff5a1f"/><text x="104" y="300" fill="#b6bcc3">03</text><text x="140" y="300" fill="#f4f2ee">licence.detected</text><text x="104" y="320" fill="#6a7178">spdx=MPL-2.0</text></g>
			<g><circle cx="84" cy="366" r="4" fill="#ff5a1f"/><text x="104" y="372" fill="#b6bcc3">04</text><text x="140" y="372" fill="#f4f2ee">possibility.inferred</text><text x="104" y="392" fill="#6a7178">id=sdf-text</text></g>
			<g><circle cx="84" cy="438" r="4" fill="#ff5a1f"/><text x="104" y="444" fill="#b6bcc3">05</text><text x="140" y="444" fill="#f4f2ee">cluster.merged</text><text x="104" y="464" fill="#6a7178">5 sources → 1</text></g>
			<g><circle cx="84" cy="510" r="4" fill="#ff5a1f"/><text x="104" y="516" fill="#b6bcc3">06</text><text x="140" y="516" fill="#f4f2ee">editorial.curated</text><text x="104" y="536" fill="#6a7178">by=dean · featured</text></g>
			<g opacity=".45"><circle cx="84" cy="582" r="4" fill="#4d565f"/><text x="104" y="588" fill="#6a7178">07 …</text><text x="140" y="588" fill="#6a7178">append-only</text></g>
		</g>
	</g>

	<!-- projection A -->
	<g>
		<path d="M320 300 H382" stroke="#4cc2f0" stroke-width="1.5" fill="none" marker-end="url(#esArrow)"/>
		<rect x="388" y="104" width="184" height="230" rx="4" fill="#0c1114" stroke="#2a3238"/>
		<text x="408" y="140" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4cc2f0" letter-spacing="1">PROJECTION A</text>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="408" y="176">coverage_by_vertical</text>
			<text x="408" y="200">novelty_index</text>
			<text x="408" y="224">unmapped_gaps</text>
			<text x="408" y="248">recent_activity</text>
		</g>
		<text x="408" y="296" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178">rebuildable · disposable</text>
		<text x="408" y="316" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#4d565f">feeds the wall</text>
	</g>

	<!-- projection B -->
	<g>
		<path d="M320 470 H382" stroke="#ff5a1f" stroke-width="1.5" fill="none" marker-end="url(#esArrowO)"/>
		<rect x="388" y="394" width="184" height="230" rx="4" fill="#140d09" stroke="#332620"/>
		<text x="408" y="430" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#ff5a1f" letter-spacing="1">PROJECTION B</text>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="408" y="466">licence_ledger</text>
			<text x="408" y="490">provenance_chain</text>
			<text x="408" y="514">takedown_queue</text>
			<text x="408" y="538">attribution_text</text>
		</g>
		<text x="408" y="586" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178">rebuildable · auditable</text>
		<text x="408" y="606" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#4d565f">feeds rights claims</text>
	</g>

	<!-- what this buys, and what it costs -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="17">
		<path d="M600 104 V624" stroke="#1c2126"/>
		<text x="624" y="140" fill="#4fce8a">+</text>
		<text x="624" y="172" fill="#8b929a">audit trail</text>
		<text x="624" y="196" fill="#8b929a">free</text>
		<text x="624" y="220" fill="#8b929a">re-sorts</text>

		<text x="624" y="290" fill="#ff8a4c">−</text>
		<text x="624" y="322" fill="#8b929a">projection</text>
		<text x="624" y="346" fill="#8b929a">cost</text>
		<text x="624" y="370" fill="#8b929a">event schema</text>
		<text x="624" y="394" fill="#8b929a">is forever</text>

		<text x="624" y="464" fill="#6a7178">never</text>
		<text x="624" y="488" fill="#6a7178">mutate</text>
		<text x="624" y="512" fill="#6a7178">history</text>
	</g>

	<g font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">
		<path d="M72 700 H728" stroke="#1c2126"/>
		<text x="72" y="740">the catalogue reads projections; the ledger reads the log.</text>
		<text x="72" y="772" fill="#4d565f">neither reads the other's table.</text>
		<text x="72" y="812" fill="#ff5a1f">CMS-managed presentation ← publish contract →</text>
		<text x="72" y="844" fill="#6a7178">hunt-engine working state stays outside the CMS.</text>
	</g>
</svg>
