<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Monoline mark plate: one stroke weight, unchanged from 64 pixels down to 28">
	<defs>
		<radialGradient id="bg" cx="50%" cy="32%" r="74%">
			<stop offset="0%" stop-color="#1a1e22"/>
			<stop offset="100%" stop-color="#08090a"/>
		</radialGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#bg)"/>

	<!-- The mark. This is the content; everything below is its evidence. -->
	<g transform="translate(400,300)">
		<g fill="none" stroke="#f4f2ee" stroke-width="28.8" stroke-linecap="butt">
			<path d="M6 -44 L50 46 L94 -44"/>
			<path d="M26 12 H74"/>
		</g></g>
	<text x="400" y="556" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#f4f2ee">one stroke weight, scaling geometry, nothing else to specify</text>

	<path d="M96 600 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
	<text x="96" y="636" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">the same geometry, reduced</text>

<g transform="translate(190,712)">
		<g fill="none" stroke="#f4f2ee" stroke-width="9" stroke-linecap="butt">
			<path d="M6 -44 L50 46 L94 -44"/>
			<path d="M26 12 H74"/>
		</g></g>
	<text x="190" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">100px</text>
<g transform="translate(400,724)">
		<g fill="none" stroke="#f4f2ee" stroke-width="5.22" stroke-linecap="butt">
			<path d="M6 -44 L50 46 L94 -44"/>
			<path d="M26 12 H74"/>
		</g></g>
	<text x="400" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">58px</text>
<g transform="translate(610,734)">
		<g fill="none" stroke="#f4f2ee" stroke-width="2.88" stroke-linecap="butt">
			<path d="M6 -44 L50 46 L94 -44"/>
			<path d="M26 12 H74"/>
		</g></g>
	<text x="610" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">32px</text>

	<path d="M96 846 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
<text x="96" y="888" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#6a7178">The weight is the rule; the geometry scales for free.</text>
<text x="96" y="920" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#4c545c">One weight is checkable with a ruler. Two is a judgement.</text>

	<path d="M96 958 H704" stroke="#1c2126"/>
	<text x="96" y="988" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">holds: one weight · flat</text>
	<text x="728" y="988" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#f2a33c">breaks below 20px</text>
</svg>
