<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Monoline mark plate: one stroke weight, unchanged from 64 pixels down to 28" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><g fill="none" stroke="#f4f2ee" stroke-linecap="butt" stroke-width="28.8"><path d="M6 -44 L50 46 L94 -44" transform="translate(400,300)"/><path d="M26 12 H74" transform="translate(400,300)"/></g></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="middle">one stroke weight, scaling geometry, nothing else to specify</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><g fill="none" stroke="#f4f2ee" stroke-linecap="butt" stroke-width="9"><path d="M6 -44 L50 46 L94 -44" transform="translate(190,712)"/><path d="M26 12 H74" transform="translate(190,712)"/></g></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><g fill="none" stroke="#f4f2ee" stroke-linecap="butt" stroke-width="5.22"><path d="M6 -44 L50 46 L94 -44" transform="translate(400,724)"/><path d="M26 12 H74" transform="translate(400,724)"/></g></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><g fill="none" stroke="#f4f2ee" stroke-linecap="butt" stroke-width="2.88"><path d="M6 -44 L50 46 L94 -44" transform="translate(610,734)"/><path d="M26 12 H74" transform="translate(610,734)"/></g></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="19">The weight is the rule; the geometry scales for free.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="17">One weight is checkable with a ruler. Two is a judgement.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: one weight · flat</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="17" text-anchor="end">breaks below 20px</text></svg>