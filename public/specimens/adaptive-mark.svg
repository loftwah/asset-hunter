<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Adaptive mark plate: one identity redrawn for four placement contexts">
	<defs>
		<radialGradient id="ambg" cx="50%" cy="30%" r="76%">
			<stop offset="0%" stop-color="#191d21"/>
			<stop offset="100%" stop-color="#08090a"/>
		</radialGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#ambg)"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="70" fill="#ff5a1f" letter-spacing="2">ONE IDENTITY · FOUR REDRAWS</text>
		<text x="72" y="90" fill="#6a7178">bound: same rhythm, same 2:1 angle</text>
	</g>

	<!-- A: app icon. The mark fills its container; the wordmark is impossible. -->
	<g>
		<rect x="72" y="104" width="300" height="300" rx="68" fill="#ff5a1f"/>
		<path d="M150 176 L222 176 L186 254 Z" fill="#08090a"/>
		<path d="M294 176 L222 176 L258 254 Z" fill="#08090a"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="72" y="440">A · app icon · 1 colour · 60% margin</text>
		</g>
	</g>

	<!-- B: horizontal lockup -->
	<g>
		<rect x="404" y="104" width="324" height="142" rx="4" fill="#0e1114" stroke="#23272c"/>
		<path d="M432 150 L470 150 L451 200 Z" fill="#f4f2ee"/>
		<path d="M508 150 L470 150 L489 200 Z" fill="#ff5a1f"/>
		<g font-family="ui-monospace,Menlo,monospace">
			<text x="534" y="164" font-size="21" fill="#f4f2ee" letter-spacing="1">NORTH</text>
			<text x="534" y="192" font-size="21" fill="#8b929a" letter-spacing="4">FIELD</text>
		</g>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="404" y="282">B · horizontal · mark + wordmark</text>
		</g>
	</g>

	<!-- C: stacked lockup, markspacing recomputed not inherited -->
	<g>
		<rect x="404" y="308" width="152" height="152" rx="4" fill="#0e1114" stroke="#23272c"/>
		<path d="M432 356 L472 356 L452 412 Z" fill="#f4f2ee"/>
		<path d="M512 356 L472 356 L492 412 Z" fill="#ff5a1f"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="404" y="496">C · stacked</text>
		</g>
		<text x="580" y="380" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">clear space</text>
		<path d="M576 356 V424" stroke="#4cc2f0" stroke-width="1" stroke-dasharray="3 4"/>
		<path d="M572 356 h8 M572 424 h8" stroke="#4cc2f0"/>
	</g>

	<!-- D: single-colour / one-ink, the only variant allowed on paper -->
	<g>
		<rect x="404" y="524" width="324" height="180" rx="4" fill="#f4f2ee"/>
		<path d="M446 566 L498 566 L472 634 Z" fill="#08090a"/>
		<path d="M550 566 L498 566 L524 634 Z" fill="#08090a"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#08090a" letter-spacing="3">
			<text x="586" y="608">ONE INK</text>
		</g>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="404" y="740">D · one ink · no second colour exists</text>
		</g>
	</g>

	<!-- the invariant, drawn: same angle, different proportion -->
	<g>
		<path d="M72 790 H728" stroke="#1c2126"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">
			<text x="72" y="828">invariant: 2:1 apex angle · 1 unit stroke · open counter</text>
		</g>
		<g stroke="#4cc2f0" stroke-width="1" opacity=".7">
			<path d="M72 860 L200 940"/>
			<path d="M296 860 L200 940"/>
		</g>
		<circle cx="200" cy="940" r="4" fill="#4cc2f0"/>
		<text x="222" y="932" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4cc2f0">2:1</text>
		<text x="728" y="932" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4d565f" text-anchor="end">proportion varies, angle does not</text>
	</g>
</svg>
