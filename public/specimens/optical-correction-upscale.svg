<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Optical correction plate: a mark drawn for its largest size rather than scaled to it">
	<defs>
		<radialGradient id="bg" cx="50%" cy="32%" r="74%">
			<stop offset="0%" stop-color="#1a1e22"/>
			<stop offset="100%" stop-color="#08090a"/>
		</radialGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#bg)"/>

	<!-- The mark. This is the content; everything below is its evidence. -->
	<g transform="translate(400,300)">
		<g fill="none" stroke="#f4f2ee" stroke-width="16" stroke-linejoin="miter">
			<path d="M-147.20000000000002 -140.8 H140.8 V-32 H-147.20000000000002 Z"/>
			<path d="M-147.20000000000002 140.8 H140.8 V32 H-147.20000000000002 Z"/>
			<path d="M-147.20000000000002 -140.8 V140.8"/>
		</g></g>
	<text x="400" y="556" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="25" fill="#f4f2ee">master at 48px; every other size drawn from it</text>

	<path d="M96 600 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
	<text x="96" y="636" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">the same geometry, reduced</text>

<g transform="translate(190,712)">
		<g fill="none" stroke="#f4f2ee" stroke-width="5" stroke-linejoin="miter">
			<path d="M-46 -44 H44 V-10 H-46 Z"/>
			<path d="M-46 44 H44 V10 H-46 Z"/>
			<path d="M-46 -44 V44"/>
		</g></g>
	<text x="190" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">100px</text>
<g transform="translate(400,724)">
		<g fill="none" stroke="#f4f2ee" stroke-width="2.9" stroke-linejoin="miter">
			<path d="M-26.68 -25.52 H25.52 V-5.8 H-26.68 Z"/>
			<path d="M-26.68 25.52 H25.52 V5.8 H-26.68 Z"/>
			<path d="M-26.68 -25.52 V25.52"/>
		</g></g>
	<text x="400" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">58px</text>
<g transform="translate(610,734)">
		<g fill="none" stroke="#f4f2ee" stroke-width="1.6" stroke-linejoin="miter">
			<path d="M-14.72 -14.08 H14.08 V-3.2 H-14.72 Z"/>
			<path d="M-14.72 14.08 H14.08 V3.2 H-14.72 Z"/>
			<path d="M-14.72 -14.08 V14.08"/>
		</g></g>
	<text x="610" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">32px</text>

	<path d="M96 846 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
<text x="96" y="888" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#6a7178">Scaling multiplies the weight; drawing does not.</text>
<text x="96" y="920" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4c545c">At 6× the counters come back. The size list is the deliverable.</text>

	<path d="M96 958 H704" stroke="#1c2126"/>
	<text x="96" y="988" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">holds: authored at each size</text>
	<text x="728" y="988" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#f2a33c">breaks without the size list</text>
</svg>
