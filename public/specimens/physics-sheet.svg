<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Physics sheet plate: a dismiss gesture driven by a real spring rather than a timed transition">
	<defs>
		<clipPath id="psClip"><rect width="800" height="1000"/></clipPath>
		<clipPath id="psCurve"><rect x="60" y="828" width="680" height="140"/></clipPath>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="72" fill="#ff5a1f" letter-spacing="2">VELOCITY CARRIES THE INTENT</text>
		<text x="72" y="92" fill="#6a7178">a timed transition cannot know how fast you meant it</text>
	</g>

	<!-- Everything between the header and the chart lives in its own band, so
	     no annotation can wander into the curve below. -->
	<g clip-path="url(#psClip)">
		<!-- the application behind, dimmed -->
		<g opacity=".22" fill="#2b323a">
			<rect x="72" y="120" width="180" height="14" rx="2"/>
			<rect x="72" y="152" width="120" height="14" rx="2"/>
			<rect x="72" y="200" width="656" height="90" rx="4"/>
			<rect x="72" y="304" width="656" height="90" rx="4"/>
		</g>
		<rect width="800" height="1000" fill="#08090a" opacity=".55"/>

		<!-- the sheet, mid-flight: rotated by the drag, scaled by velocity -->
		<g transform="rotate(-7 400 470)">
			<rect x="96" y="238" width="600" height="400" rx="14" fill="#121518"/>
			<rect x="96" y="238" width="600" height="400" rx="14" fill="none" stroke="#2c3238"/>
			<rect x="96" y="238" width="600" height="3" fill="#343b42"/>
			<rect x="370" y="264" width="60" height="5" rx="2.5" fill="#3a4148"/>

			<g font-family="ui-monospace,Menlo,monospace">
				<text x="128" y="312" font-size="17" fill="#6a7178">MOVEMENT SETTINGS</text>
				<text x="128" y="356" font-size="30" fill="#f4f2ee">Spring response</text>

				<text x="128" y="410" font-size="16" fill="#8b929a">stiffness</text>
				<rect x="230" y="401" width="330" height="6" fill="#23272c"/>
				<rect x="230" y="401" width="231" height="6" fill="#ff5a1f"/>
				<text x="664" y="410" font-size="16" fill="#b6bcc3" text-anchor="end">210</text>

				<text x="128" y="462" font-size="16" fill="#8b929a">damping</text>
				<rect x="230" y="453" width="330" height="6" fill="#23272c"/>
				<rect x="230" y="453" width="262" height="6" fill="#ff5a1f"/>
				<text x="664" y="462" font-size="16" fill="#b6bcc3" text-anchor="end">0.82</text>

				<text x="128" y="514" font-size="16" fill="#8b929a">velocity handoff</text>
				<rect x="230" y="505" width="330" height="6" fill="#23272c"/>
				<rect x="230" y="505" width="298" height="6" fill="#4cc2f0"/>
				<text x="664" y="514" font-size="16" fill="#b6bcc3" text-anchor="end">on</text>

				<path d="M128 546 H664" stroke="#23272c"/>
				<text x="128" y="580" font-size="15" fill="#6a7178">reduce motion · re-grab · interrupt</text>
			</g>
		</g>

		<!-- the drag trail: the positions the gesture actually passed through -->
		<path d="M96 660 Q300 560 470 486 T700 330" fill="none" stroke="#ff5a1f" stroke-width="2" opacity=".5" stroke-dasharray="3 6"/>
		<g fill="#ff5a1f">
			<circle cx="96" cy="660" r="4" opacity=".3"/>
			<circle cx="250" cy="566" r="4" opacity=".4"/>
			<circle cx="400" cy="504" r="4" opacity=".55"/>
			<circle cx="540" cy="424" r="4" opacity=".7"/>
			<circle cx="700" cy="330" r="5" opacity=".9"/>
		</g>
		<text x="700" y="308" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#ff5a1f" text-anchor="end">release</text>
	</g>

	<!-- the curve: what the spring does after the finger is gone.
	     Own band, clipped, so nothing from above can intrude. -->
	<g>
		<path d="M72 800 H728" stroke="#1c2126"/>
		<text x="72" y="828" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">position over time</text>
		<text x="728" y="828" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#4d565f" text-anchor="end">cross the threshold, momentum finishes</text>

		<g clip-path="url(#psCurve)">
			<g stroke="#1a2026">
				<path d="M72 862 H728 M72 902 H728 M72 942 H728"/>
			</g>
			<!-- The threshold line sits at the crossing, not above it: the point
			     of the plate is that momentum commits the gesture. -->
			<path d="M72 878 H728" stroke="#f2a33c" stroke-opacity=".45" stroke-dasharray="4 6"/>
			<text x="716" y="872" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#f2a33c" text-anchor="end">threshold crossed</text>

			<path d="M72 962 L124 960 L176 950 L228 926 L280 878 L332 850 L384 844 L436 862 L488 878 L540 872 L592 858 L644 852 L696 854 L728 856"
				fill="none" stroke="#4cc2f0" stroke-width="2"/>
			<circle cx="280" cy="878" r="4" fill="#ff5a1f"/>
			<text x="272" y="898" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#ff5a1f" text-anchor="end">release</text>
			<text x="716" y="966" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#4d565f" text-anchor="end">time</text>
		</g>
	</g>
</svg>
