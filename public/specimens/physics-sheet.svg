<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Physics sheet plate: a dismiss gesture driven by a real spring rather than a timed transition" role="img" viewBox="0 0 800 1000"><defs><clipPath id="psClip"><rect width="800" height="1000"/></clipPath><clipPath id="psCurve"><rect width="680" height="140" x="60" y="828"/></clipPath></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="72" fill="#ff5a1f" letter-spacing="2">VELOCITY CARRIES THE INTENT</text><text x="72" y="92" fill="#6a7178">a timed transition cannot know how fast you meant it</text></g><g clip-path="url(#psClip)"><g fill="#2b323a" opacity=".22"><rect width="180" height="14" x="72" y="120" rx="2"/><rect width="120" height="14" x="72" y="152" rx="2"/><rect width="656" height="90" x="72" y="200" rx="4"/><rect width="656" height="90" x="72" y="304" rx="4"/></g><rect width="800" height="1000" fill="#08090a" opacity=".55"/><g transform="rotate(-7 400 470)"><rect width="600" height="400" x="96" y="238" fill="#121518" rx="14"/><rect width="600" height="400" x="96" y="238" fill="none" stroke="#2c3238" rx="14"/><rect width="600" height="3" x="96" y="238" fill="#343b42"/><rect width="60" height="5" x="370" y="264" fill="#3a4148" rx="2.5"/><g font-family="ui-monospace,Menlo,monospace"><text x="128" y="312" fill="#6a7178" font-size="17">MOVEMENT SETTINGS</text><text x="128" y="356" fill="#f4f2ee" font-size="30">Spring response</text><text x="128" y="410" fill="#8b929a" font-size="16">stiffness</text><rect width="330" height="6" x="230" y="401" fill="#23272c"/><rect width="231" height="6" x="230" y="401" fill="#ff5a1f"/><text x="664" y="410" fill="#b6bcc3" font-size="16" text-anchor="end">210</text><text x="128" y="462" fill="#8b929a" font-size="16">damping</text><rect width="330" height="6" x="230" y="453" fill="#23272c"/><rect width="262" height="6" x="230" y="453" fill="#ff5a1f"/><text x="664" 