<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Diegetic damage plate: a cracked visor vignette standing in for a health bar">
	<defs>
		<radialGradient id="rim" cx="50%" cy="50%" r="62%">
			<stop offset="58%" stop-color="#000" stop-opacity="0"/>
			<stop offset="82%" stop-color="#ff5a1f" stop-opacity=".28"/>
			<stop offset="100%" stop-color="#c9240b" stop-opacity=".62"/>
		</radialGradient>
		<radialGradient id="field" cx="46%" cy="38%" r="78%">
			<stop offset="0%" stop-color="#2b3138"/>
			<stop offset="100%" stop-color="#0c0e11"/>
		</radialGradient>
		<filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
		<clipPath id="frame"><rect width="800" height="1000"/></clipPath>
	</defs>
	<g clip-path="url(#frame)">
		<rect width="800" height="1000" fill="url(#field)"/>
		<!-- distant terrain, read only as tone -->
		<g opacity=".5" filter="url(#soft)">
			<path d="M0 690 L150 596 L268 664 L392 566 L520 648 L640 578 L800 676 L800 1000 L0 1000Z" fill="#39424b"/>
			<path d="M0 782 L128 726 L262 792 L410 720 L566 800 L700 744 L800 786 L800 1000 L0 1000Z" fill="#222830"/>
		</g>
		<!-- figure: readable only as a silhouette -->
		<g fill="#0a0c0e" opacity=".92">
			<path d="M362 404 q34 -30 68 0 l6 54 h-80Z"/>
			<path d="M336 468 q56 -22 112 0 l26 132 q-82 30 -164 0Z"/>
			<path d="M326 610 q68 22 136 0 l14 130 q-84 20 -164 0Z"/>
			<path d="M340 748 q52 16 104 0 l8 168 h-120Z"/>
		</g>
		<!-- impact bloom -->
		<g opacity=".9">
			<circle cx="556" cy="430" r="120" fill="#ff5a1f" opacity=".2" filter="url(#soft)"/>
			<circle cx="556" cy="430" r="46" fill="#ffb08c" opacity=".35" filter="url(#soft)"/>
		</g>
		<!-- crack: the health indicator -->
		<g stroke="#ffd9c9" stroke-linecap="round" fill="none">
			<path d="M556 430 L604 372 L636 430 L592 470 L632 536 L586 560 L556 500 L520 548 L498 486 L540 452 Z" stroke-width="3" opacity=".92"/>
			<path d="M556 430 L512 356 L470 300" stroke-width="1.4" opacity=".5"/>
			<path d="M604 372 L654 330" stroke-width="1.4" opacity=".5"/>
			<path d="M520 548 L486 606 L452 640" stroke-width="1.2" opacity=".38"/>
			<path d="M632 536 L690 566" stroke-width="1.2" opacity=".38"/>
			<path d="M636 430 L706 418" stroke-width="1.2" opacity=".32"/>
			<path d="M540 452 L508 404" stroke-width="1.2" opacity=".38"/>
			<path d="M592 470 L660 486" stroke-width="1" opacity=".28"/>
		</g>
		<!-- visor rim -->
		<rect width="800" height="1000" fill="url(#rim)"/>
		<!-- scanline: the visor is a surface -->
		<g stroke="#fff" stroke-width="1" opacity=".05">
			<path d="M0 120 H800 M0 260 H800 M0 400 H800 M0 540 H800 M0 680 H800 M0 820 H800"/>
		</g>
		<!-- the bar that is deliberately absent -->
		<g opacity=".22">
			<rect x="300" y="920" width="200" height="6" fill="none" stroke="#f4f2ee" stroke-dasharray="2 8"/>
		</g>
	</g>
</svg>
