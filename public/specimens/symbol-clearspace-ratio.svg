<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Symbol plate: a mark sized inside its clearspace, with the ratio stated">
	<defs>
		<radialGradient id="bg" cx="50%" cy="32%" r="74%">
			<stop offset="0%" stop-color="#1a1e22"/>
			<stop offset="100%" stop-color="#08090a"/>
		</radialGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#bg)"/>

	<!-- The mark. This is the content; everything below is its evidence. -->
	<g transform="translate(400,300)">
		<g stroke="#4cc2f0" stroke-width="2.8800000000000003" stroke-dasharray="9.600000000000001 12.8" fill="none" opacity=".55">
			<rect x="-169.60000000000002" y="-169.60000000000002" width="339.20000000000005" height="339.20000000000005"/>
		</g>
		<g fill="none" stroke="#f4f2ee" stroke-width="19.200000000000003" stroke-linejoin="miter">
			<path d="M-108.80000000000001 -96 H108.80000000000001 V-19.200000000000003 H-108.80000000000001 Z"/>
			<path d="M-108.80000000000001 96 H108.80000000000001 V19.200000000000003 H-108.80000000000001 Z"/>
			<path d="M-108.80000000000001 -96 V96"/>
		</g></g>
	<text x="400" y="556" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#f4f2ee">clearspace is a ratio of the mark, not nine exported crops</text>

	<path d="M96 600 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
	<text x="96" y="636" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">the same geometry, reduced</text>

<g transform="translate(190,712)">
		<g stroke="#4cc2f0" stroke-width="0.9" stroke-dasharray="3 4" fill="none" opacity=".55">
			<rect x="-53" y="-53" width="106" height="106"/>
		</g>
		<g fill="none" stroke="#f4f2ee" stroke-width="6" stroke-linejoin="miter">
			<path d="M-34 -30 H34 V-6 H-34 Z"/>
			<path d="M-34 30 H34 V6 H-34 Z"/>
			<path d="M-34 -30 V30"/>
		</g></g>
	<text x="190" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">100px</text>
<g transform="translate(400,724)">
		<g stroke="#4cc2f0" stroke-width="0.522" stroke-dasharray="1.7399999999999998 2.32" fill="none" opacity=".55">
			<rect x="-30.740000000000002" y="-30.740000000000002" width="61.480000000000004" height="61.480000000000004"/>
		</g>
		<g fill="none" stroke="#f4f2ee" stroke-width="3.4799999999999995" stroke-linejoin="miter">
			<path d="M-19.72 -17.4 H19.72 V-3.4799999999999995 H-19.72 Z"/>
			<path d="M-19.72 17.4 H19.72 V3.4799999999999995 H-19.72 Z"/>
			<path d="M-19.72 -17.4 V17.4"/>
		</g></g>
	<text x="400" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">58px</text>
<g transform="translate(610,734)">
		<g stroke="#4cc2f0" stroke-width="0.28800000000000003" stroke-dasharray="0.96 1.28" fill="none" opacity=".55">
			<rect x="-16.96" y="-16.96" width="33.92" height="33.92"/>
		</g>
		<g fill="none" stroke="#f4f2ee" stroke-width="1.92" stroke-linejoin="miter">
			<path d="M-10.88 -9.6 H10.88 V-1.92 H-10.88 Z"/>
			<path d="M-10.88 9.6 H10.88 V1.92 H-10.88 Z"/>
			<path d="M-10.88 -9.6 V9.6"/>
		</g></g>
	<text x="610" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">32px</text>

	<path d="M96 846 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
<text x="96" y="888" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">Cap the mark at half a square tile and 42% of a tall one.</text>
<text x="96" y="920" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#4c545c">A new container shape is a new drawing, not a crop.</text>

	<path d="M96 958 H704" stroke="#1c2126"/>
	<text x="96" y="988" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">holds: 0.25 mark widths</text>
	<text x="728" y="988" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#f2a33c">breaks on a new shape</text>
</svg>
