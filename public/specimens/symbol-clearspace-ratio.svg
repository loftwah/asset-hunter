<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Symbol plate: a mark sized inside its clearspace, with the ratio stated" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><g fill="none" stroke="#4cc2f0" stroke-dasharray="9.6 12.8" stroke-width="2.88" opacity=".55" transform="translate(400,300)"><rect width="339.2" height="339.2" x="-169.6" y="-169.6"/></g><g fill="none" stroke="#f4f2ee" stroke-linejoin="miter" stroke-width="19.2"><path d="M-108.80000000000001 -96 H108.80000000000001 V-19.200000000000003 H-108.80000000000001 Z" transform="translate(400,300)"/><path d="M-108.80000000000001 96 H108.80000000000001 V19.200000000000003 H-108.80000000000001 Z" transform="translate(400,300)"/><path d="M-108.80000000000001 -96 V96" transform="translate(400,300)"/></g></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="20" text-anchor="middle">clearspace is a ratio of the mark, not nine exported crops</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><g fill="none" stroke="#4cc2f0" stroke-dasharray="3 4" stroke-width=".9" opacity=".55" transform="translate(190,712)"><rect width="106" height="106" x="-53" y="-53"/></g><g fill="none" stroke="#f4f2ee" stroke-linejoin="miter" stroke-width="6"><path d="M-34 -30 H34 V-6 H-34 Z" transform="translate(190,712)"/><path d="M-34 30 H34 V6 H-34 Z" transform="translate(190,712)"/><path d="M-34 -30 V30" transform="translate(190,712)"/></g></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><g fill="none" stroke="#4cc2f0" stroke-dasharray="1.74 2.32" stroke-width=".522" opacity=".55" transform="translate(400,724)"><rect width="61.48" height="61.48" x="-30.74" y="-30.74"/></g><g fill="none" stroke="#f4f2ee" stroke-linejoin="miter" stroke-width="3.48"><path d="M-19.72 -17.4 H19.72 V-3.4799999999999995 H-19.72 Z" transform="translate(400,724)"/><path d="M-19.72 17.4 H19.72 V3.4799999999999995 H-19.72 Z" transform="translate(400,724)"/><path d="M-19.72 -17.4 V17.4" transform="translate(400,724)"/></g></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><g fill="none" stroke="#4cc2f0" stroke-dasharray=".96 1.28" stroke-width=".288" opacity=".55" transform="translate(610,734)"><rect width="33.92" height="33.92" x="-16.96" y="-16.96"/></g><g fill="none" stroke="#f4f2ee" stroke-linejoin="miter" stroke-width="1.92"><path d="M-10.88 -9.6 H10.88 V-1.92 H-10.88 Z" transform="translate(610,734)"/><path d="M-10.88 9.6 H10.88 V1.92 H-10.88 Z" transform="translate(610,734)"/><path d="M-10.88 -9.6 V9.6" transform="translate(610,734)"/></g></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">Cap the mark at half a square tile and 42% of a tall one.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="19">A new container shape is a new drawing, not a crop.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: 0.25 mark widths</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="17" text-anchor="end">breaks on a new shape</text></svg>