<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Generative monogram plate: a mark produced by a rule set that stays recognisable across every seed" role="img" viewBox="0 0 800 1000"><defs><linearGradient id="gmone" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ff5a1f"/><stop offset="100%" stop-color="#f2a33c"/></linearGradient></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="70" fill="#ff5a1f" letter-spacing="2">A RULE SET, NOT AN IMAGE</text><text x="72" y="90" fill="#6a7178">recognisable as a family at every seed</text></g><g><rect width="656" height="440" x="72" y="104" fill="#0a0d10" stroke="#1c2126" rx="3"/><g><g transform="translate(96,128)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="14" height="92" x="-7" y="-46" fill="url(#gmone)" transform="rotate(12)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-12)"/></g><text x="60" y="140" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">seed 0</text></g><g transform="translate(96,128) translate(240,0)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="14" height="92" x="-7" y="-46" fill="url(#gmone)" transform="rotate(18)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-18)"/></g><text x="60" y="140" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">seed 1</text></g><g transform="translate(96,128) translate(480,0)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="14" height="92" x="-7" y="-46" fill="url(#gmone)" transform="rotate(24)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-24)"/></g><text x="60" y="140" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">seed 2 · bound</text></g><g transform="translate(96,128) translate(0,180)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="14" height="92" x="-7" y="-46" fill="#f4f2ee" transform="rotate(-12)"/><rect width="92" height="14" x="-46" y="-7" fill="url(#gmone)" transform="rotate(12)"/></g><text x="60" y="140" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">ink swap</text></g><g transform="translate(96,128) translate(240,180)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="18" height="92" x="-9" y="-46" fill="url(#gmone)" transform="rotate(15)"/><rect width="92" height="18" x="-46" y="-9" fill="#f4f2ee" transform="rotate(-15)"/></g><text x="60" y="140" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">weight +1</text></g><g transform="translate(96,128) translate(480,180)"><rect width="120" height="120" x="0" y="0" fill="#0e1215"/><g transform="translate(60,60)"><rect width="14" height="92" x="-7" y="-46" fill="url(#gmone)" transform="rotate(21)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-21)"/></g><text x="60" y="140" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">seed 5</text></g></g><g><text x="0" y="-16" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14" transform="translate(96,452)">family test, at 24px</text><g><g transform="translate(96,452) translate(0,16) translate(12,12) scale(0.2)"><rect width="14" height="92" x="-7" y="-46" fill="#ff5a1f"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee"/></g><g transform="translate(96,452) translate(0,16) translate(72,12) scale(0.2)"><rect width="14" height="92" x="-7" y="-46" fill="#ff5a1f" transform="rotate(18)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-18)"/></g><g transform="translate(96,452) translate(0,16) translate(132,12) scale(0.2)"><rect width="14" height="92" x="-7" y="-46" fill="#ff5a1f" transform="rotate(24)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-24)"/></g><g transform="translate(96,452) translate(0,16) translate(192,12) scale(0.2)"><rect width="18" height="92" x="-9" y="-46" fill="#f4f2ee"/><rect width="92" height="18" x="-46" y="-9" fill="#ff5a1f"/></g><g transform="translate(96,452) translate(0,16) translate(252,12) scale(0.2)"><rect width="14" height="92" x="-7" y="-46" fill="#f4f2ee" transform="rotate(-12)"/><rect width="92" height="14" x="-46" y="-7" fill="#ff5a1f" transform="rotate(12)"/></g><g transform="translate(96,452) translate(0,16) translate(312,12) scale(0.2)"><rect width="14" height="92" x="-7" y="-46" fill="#ff5a1f" transform="rotate(21)"/><rect width="92" height="14" x="-46" y="-7" fill="#f4f2ee" transform="rotate(-21)"/></g></g><text x="404" y="40" fill="#4fce8a" font-family="ui-monospace,Menlo,monospace" font-size="14" transform="translate(96,452)">reads as one identity</text></g></g><g><rect width="656" height="216" x="72" y="584" fill="#0a0d10" stroke="#1c2126" rx="3"/><text x="96" y="620" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="15">the whole generator</text><g font-family="ui-monospace,Menlo,monospace" font-size="15"><text x="96" y="660" fill="#8b929a">angle</text><rect width="300" height="6" x="230" y="650" fill="#1a2026"/><rect width="228" height="6" x="230" y="650" fill="#ff5a1f"/><text x="546" y="660" fill="#b6bcc3">12°–24°</text><text x="704" y="660" fill="#6a7178" text-anchor="end">bounded</text><text x="96" y="700" fill="#8b929a">bar ratio</text><rect width="300" height="6" x="230" y="690" fill="#1a2026"/><rect width="150" height="6" x="230" y="690" fill="#a68bfb"/><text x="546" y="700" fill="#b6bcc3">1:6.6</text><text x="96" y="740" fill="#8b929a">ink order</text><text x="230" y="740" fill="#f4f2ee">accent first / paper second</text><text x="704" y="740" fill="#6a7178" text-anchor="end">swappable</text><text x="96" y="780" fill="#6a7178">fixed:</text><text x="230" y="780" fill="#8b929a">cross centre · equal bar length · open counter · square ends</text></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="848" fill="#f4f2ee">Generative without constraints is noise, not identity.</text><text x="72" y="880" fill="#6a7178">Ship the seed with the identity so the next one is never a blank page.</text><text x="72" y="920" fill="#6a7178">And keep a fixed master — the family needs one member that never varies.</text><text x="72" y="956" fill="#4d565f">Licence note: a generated mark is an output, not a clearance.</text></g></svg>