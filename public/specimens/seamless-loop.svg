<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Seamless loop plate: a cycle closed by construction rather than by crossfade" role="img" viewBox="0 0 800 1000"><defs><marker id="slArrow" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="3.5"><path fill="#4fce8a" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="70" fill="#ff5a1f" letter-spacing="2">THE SEAM IS A SOLVING PROBLEM</text><text x="72" y="90" fill="#6a7178">crossfading hides it; periodicity removes it</text></g><g><rect width="200" height="260" x="72" y="104" fill="#0a0d10" stroke="#1c2126" rx="3"/><text x="92" y="136" fill="#ff8a4c" font-family="ui-monospace,Menlo,monospace" font-size="15">1 · crossfade</text><g><rect width="160" height="120" x="92" y="156" fill="#141a20"/><rect width="160" height="34" x="92" y="156" fill="#ff5a1f" opacity=".22"/><rect width="160" height="34" x="92" y="242" fill="#4cc2f0" opacity=".18"/><path stroke="#4fce8a" stroke-dasharray="4 4" stroke-width="1.6" d="M92 276 H252"/></g><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14"><text x="92" y="308">the dip you can hear</text><text x="92" y="332">doubles your length</text><text x="92" y="352" fill="#6a7178">kills the transient</text></g></g><g><rect width="200" height="260" x="300" y="104" fill="#0a0d10" stroke="#1c2126" rx="3"/><text x="320" y="136" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="15">2 · ping-pong</text><g><rect width="160" height="120" x="320" y="156" fill="#141a20"/><g fill="none" stroke="#a68bfb" stroke-opacity=".5" stroke-width="1.4"><path d="M320 200 Q348 168 376 200 Q404 232 432 200"/><path d="M320 216 Q348 184 376 216 Q404 248 432 216"/></g><path stroke="#f2a33c" stroke-dasharray="4 4" stroke-width="1.6" d="M320 276 H480"/><text x="400" y="292" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="13" text-anchor="middle">reversal point</text></g><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14"><text x="320" y="320">free and instant</text><text x="320" y="344">but the reversal is</text><text x="320" y="364">always audible</text></g></g><g><rect width="200" height="260" x="528" y="104" fill="#0a0d10" stroke="#4fce8a" stroke-opacity=".35" rx="3"/><text x="548" y="136" fill="#4fce8a" font-family="ui-monospace,Menlo,monospace" font-size="15">3 · periodicity</text><g><rect width="160" height="120" x="548" y="156" fill="#141a20"/><g fill="none" stroke="#4fce8a" stroke-opacity=".55" stroke-width="1.4"><path d="M548 232 Q572 172 596 208 Q620 244 644 184 Q668 172 708 200"/></g><g fill="none" stroke="#4fce8a" stroke-opacity=".25" stroke-width="1"><path d="M548 220 Q572 162 596 198 Q620 234 644 176 Q668 164 708 192"/><path d="M548 244 Q572 182 596 218 Q620 254 644 192 Q668 180 708 208"/></g><circle cx="548" cy="232" r="4" fill="#4fce8a"/><circle cx="708" cy="200" r="4" fill="none" stroke="#4fce8a"/><path fill="none" stroke="#4fce8a" stroke-width="1.4" marker-end="url(#slArrow)" d="M712 200 Q726 214 712 228"/></g><g fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="14"><text x="548" y="320">end state = start state</text><text x="548" y="344">no dip, no reversal</text><text x="548" y="364" fill="#8b929a">you must design for it</text></g></g><g><rect width="656" height="240" x="72" y="404" fill="#0a0d10" stroke="#1c2126" rx="3"/><text x="96" y="440" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="15">value at t = 0 must equal value at t = period</text><g stroke="#1e2429"><path d="M96 480 H704 M96 530 H704 M96 580 H704"/><path d="M96 470 V600 M240 480 V600 M384 470 V600 M528 480 V600 M704 470 V600"/></g><g fill="none" stroke="#4fce8a" stroke-width="2"><path d="M96 596 Q168 520 240 540 Q312 560 384 500 Q456 440 528 512 Q600 584 672 508 Q690 490 704 472"/></g><g><circle cx="96" cy="596" r="5" fill="#4fce8a"/><circle cx="704" cy="472" r="5" fill="none" stroke="#4fce8a" stroke-dasharray="3 3"/><path fill="none" stroke="#4fce8a" stroke-dasharray="4 6" stroke-opacity=".3" d="M96 596 Q96 472 704 472"/><text x="716" y="466" fill="#4fce8a" font-family="ui-monospace,Menlo,monospace" font-size="13" text-anchor="end">same</text></g><text x="96" y="624" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14">the dotted line is the error you are trying to eliminate —</text><text x="96" y="646" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14">solve for the derivative, not the value</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="700" fill="#8b929a">applies to</text><g fill="#6a7178"><text x="72" y="734">scroll-linked marquees and background motion</text><text x="72" y="764">shader time uniforms (mod the period, not the offset)</text><text x="72" y="794">ambient audio beds</text><text x="72" y="824">specimen animations on the wall</text></g><text x="728" y="854" fill="#4d565f" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="end">reduced motion → static frame</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><path stroke="#1c2126" d="M72 862 H728"/><text x="72" y="898" fill="#f4f2ee">A crossfade is a patch. Periodicity is a design.</text><text x="72" y="932" fill="#6a7178">The second one is invisible because nothing has to be hidden.</text></g></svg>