<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Icon family plate: one line mark on one stroke weight and one cap height" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><g fill="none" stroke="#f4f2ee" stroke-width="28.8" transform="translate(400,300)"><rect width="281.6" height="281.6" x="-140.8" y="-140.8" rx="54.4"/></g></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="middle">one weight, one cap height, one radius — checked, not advised</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><g fill="none" stroke="#f4f2ee" stroke-width="9" transform="translate(190,712)"><rect width="88" height="88" x="-44" y="-44" rx="17"/></g></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><g fill="none" stroke="#f4f2ee" stroke-width="5.22" transform="translate(400,724)"><rect width="51.04" height="51.04" x="-25.52" y="-25.52" rx="9.86"/></g></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><g fill="none" stroke="#f4f2ee" stroke-width="2.88" transform="translate(610,734)"><rect width="28.16" height="28.16" x="-14.08" y="-14.08" rx="5.44"/></g></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="18">The gate is the deliverable; the icons are an instance.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="20">A guideline nobody runs is not a constraint.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: one weight · one gate</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="end">breaks when the gate is skipped</text></svg>