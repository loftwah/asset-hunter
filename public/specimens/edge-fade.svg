<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Edge-fade plate: a wireframe that resolves into solid surface as the camera approaches" role="img" viewBox="0 0 800 1000"><defs><linearGradient id="efbg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#101820"/><stop offset="100%" stop-color="#08090a"/></linearGradient><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#4cc2f0" stop-opacity="0"/><stop offset="35%" stop-color="#4cc2f0" stop-opacity=".55"/><stop offset="100%" stop-color="#4cc2f0" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1000" fill="url(#efbg)"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="70" fill="#ff5a1f" letter-spacing="2">DENSITY BECOMES SURFACE</text><text x="72" y="90" fill="#6a7178">no pop-in, no separate far LOD</text></g><g><rect width="196" height="300" x="72" y="104" fill="#0a0e12" stroke="#1c242a" rx="3"/><g fill="none" stroke="url(#fade)" stroke-width="1"><path d="M100 340 L170 200 L240 340 L170 260 Z"/><path d="M100 340 L100 200 M240 340 L240 200 M170 200 L170 130"/><path d="M170 130 L100 200 M170 130 L240 200"/><path d="M170 130 L170 260"/><path d="M88 372 H252 M104 388 H236"/></g><text x="170" y="432" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">z = 400</text><text x="170" y="456" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">0% fill</text></g><g><rect width="196" height="300" x="302" y="104" fill="#0a0e12" stroke="#1c242a" rx="3"/><path fill="#4cc2f0" d="M330 340 L400 200 L470 340 L400 260 Z" opacity=".14"/><g fill="none" stroke="#4cc2f0" stroke-opacity=".7" stroke-width="1.2"><path d="M330 340 L400 200 L470 340 L400 260 Z"/><path d="M400 200 L400 130 M400 130 L330 200 M400 130 L470 200"/><path d="M330 340 L330 200 M470 340 L470 200"/></g><text x="400" y="432" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">z = 200</text><text x="400" y="456" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">18% fill</text></g><g><rect width="196" height="300" x="532" y="104" fill="#0a0e12" stroke="#1c242a" rx="3"/><path fill="#2a8fb8" d="M560 340 L630 200 L700 340 L630 260 Z" opacity=".85"/><path fill="#1c6f92" d="M630 200 L630 130 L560 200 Z" opacity=".85"/><path fill="#155d7d" d="M630 200 L700 200 L700 340 Z" opacity=".9"/><g fill="none" stroke="#bfe9f7" stroke-opacity=".45" stroke-width="1"><path d="M560 340 L630 200 L700 340 L630 260 Z"/></g><text x="630" y="432" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">z = 40</text><text x="630" y="456" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">100% fill · 0% edge</text></g><g><rect width="656" height="200" x="72" y="512" fill="#0a0e12" stroke="#1c242a" rx="3"/><g stroke="#1c242a"><path d="M104 552 H696 M104 592 H696 M104 632 H696 M104 672 H696"/></g><g fill="#4d565f" font-family="ui-monospace,Menlo,monospace" font-size="14"><text x="96" y="556" text-anchor="end">edge</text><text x="96" y="636" text-anchor="end">fill</text></g><g fill="none" stroke-width="2"><path stroke="#4cc2f0" d="M104 552 L250 590 L396 620 L540 638 L696 640"/><path stroke="#ff5a1f" d="M104 676 L250 656 L396 640 L540 638 L696 638"/></g><path stroke="#f2a33c" stroke-dasharray="4 5" stroke-opacity=".6" d="M460 540 V684"/><text x="466" y="556" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="14">crossover</text><text x="696" y="698" fill="#4d565f" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="end">distance</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="762" fill="#f4f2ee">A hard LOD swap draws the eye. A crossfade does not.</text><text x="72" y="800" fill="#6a7178">The same geometry is drawn the whole way in —</text><text x="72" y="826" fill="#6a7178">only the shading weight changes, so nothing appears from nothing.</text><text x="72" y="864" fill="#4fce8a">Cost: one extra pass over the same triangles.</text><text x="72" y="898" fill="#6a7178">Applies equally to markers, foliage, crowds and UI chrome.</text><text x="72" y="936" fill="#4d565f">Cheapest LOD is the one you never had to build.</text></g></svg>