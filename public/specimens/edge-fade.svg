<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Edge-fade plate: a wireframe that resolves into solid surface as the camera approaches">
	<defs>
		<linearGradient id="efbg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#101820"/>
			<stop offset="100%" stop-color="#08090a"/>
		</linearGradient>
		<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#4cc2f0" stop-opacity="0"/>
			<stop offset="35%" stop-color="#4cc2f0" stop-opacity=".55"/>
			<stop offset="100%" stop-color="#4cc2f0" stop-opacity="0"/>
		</linearGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#efbg)"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="70" fill="#ff5a1f" letter-spacing="2">DENSITY BECOMES SURFACE</text>
		<text x="72" y="90" fill="#6a7178">no pop-in, no separate far LOD</text>
	</g>

	<!-- far: pure structure, no fill -->
	<g>
		<rect x="72" y="104" width="196" height="300" rx="3" fill="#0a0e12" stroke="#1c242a"/>
		<g stroke="url(#fade)" stroke-width="1" fill="none">
			<path d="M100 340 L170 200 L240 340 L170 260 Z"/>
			<path d="M100 340 L100 200 M240 340 L240 200 M170 200 L170 130"/>
			<path d="M170 130 L100 200 M170 130 L240 200"/>
			<path d="M170 130 L170 260"/>
			<path d="M88 372 H252 M104 388 H236"/>
		</g>
		<text x="170" y="432" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4cc2f0" text-anchor="middle">z = 400</text>
		<text x="170" y="456" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178" text-anchor="middle">0% fill</text>
	</g>

	<!-- mid: edges survive, fill arrives -->
	<g>
		<rect x="302" y="104" width="196" height="300" rx="3" fill="#0a0e12" stroke="#1c242a"/>
		<path d="M330 340 L400 200 L470 340 L400 260 Z" fill="#4cc2f0" opacity=".14"/>
		<g stroke="#4cc2f0" stroke-opacity=".7" stroke-width="1.2" fill="none">
			<path d="M330 340 L400 200 L470 340 L400 260 Z"/>
			<path d="M400 200 L400 130 M400 130 L330 200 M400 130 L470 200"/>
			<path d="M330 340 L330 200 M470 340 L470 200"/>
		</g>
		<text x="400" y="432" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4cc2f0" text-anchor="middle">z = 200</text>
		<text x="400" y="456" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178" text-anchor="middle">18% fill</text>
	</g>

	<!-- near: solid, edges gone -->
	<g>
		<rect x="532" y="104" width="196" height="300" rx="3" fill="#0a0e12" stroke="#1c242a"/>
		<path d="M560 340 L630 200 L700 340 L630 260 Z" fill="#2a8fb8" opacity=".85"/>
		<path d="M630 200 L630 130 L560 200 Z" fill="#1c6f92" opacity=".85"/>
		<path d="M630 200 L700 200 L700 340 Z" fill="#155d7d" opacity=".9"/>
		<g stroke="#bfe9f7" stroke-opacity=".45" stroke-width="1" fill="none">
			<path d="M560 340 L630 200 L700 340 L630 260 Z"/>
		</g>
		<text x="630" y="432" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4cc2f0" text-anchor="middle">z = 40</text>
		<text x="630" y="456" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6a7178" text-anchor="middle">100% fill · 0% edge</text>
	</g>

	<!-- the ramp, plotted -->
	<g>
		<rect x="72" y="512" width="656" height="200" rx="3" fill="#0a0e12" stroke="#1c242a"/>
		<g stroke="#1c242a">
			<path d="M104 552 H696 M104 592 H696 M104 632 H696 M104 672 H696"/>
		</g>
		<g font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#4d565f">
			<text x="96" y="556" text-anchor="end">edge</text>
			<text x="96" y="636" text-anchor="end">fill</text>
		</g>
		<g fill="none" stroke-width="2">
			<path d="M104 552 L250 590 L396 620 L540 638 L696 640" stroke="#4cc2f0"/>
			<path d="M104 676 L250 656 L396 640 L540 638 L696 638" stroke="#ff5a1f"/>
		</g>
		<path d="M460 540 V684" stroke="#f2a33c" stroke-dasharray="4 5" stroke-opacity=".6"/>
		<text x="466" y="556" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#f2a33c">crossover</text>
		<text x="696" y="698" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#4d565f" text-anchor="end">distance</text>
	</g>

	<!-- why this beats a hard swap -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="16">
		<text x="72" y="762" fill="#f4f2ee">A hard LOD swap draws the eye. A crossfade does not.</text>
		<text x="72" y="800" fill="#6a7178">The same geometry is drawn the whole way in —</text>
		<text x="72" y="826" fill="#6a7178">only the shading weight changes, so nothing appears from nothing.</text>
		<text x="72" y="864" fill="#4fce8a">Cost: one extra pass over the same triangles.</text>
		<text x="72" y="898" fill="#6a7178">Applies equally to markers, foliage, crowds and UI chrome.</text>
		<text x="72" y="936" fill="#4d565f">Cheapest LOD is the one you never had to build.</text>
	</g>
</svg>
