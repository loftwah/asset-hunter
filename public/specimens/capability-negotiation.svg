<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Capability negotiation plate: a plugin boundary where features are declared rather than assumed" role="img" viewBox="0 0 800 1000"><defs><marker id="negok" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#4fce8a" d="M0 0 L6 3 L0 6 Z"/></marker><marker id="negno" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#ff8a4c" d="M0 0 L6 3 L0 6 Z"/></marker></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="72" fill="#ff5a1f" letter-spacing="2">DECLARE, DO NOT ASSUME</text><text x="72" y="92" fill="#6a7178">a missing capability is a value, not an exception</text></g><g><rect width="656" height="120" x="72" y="112" fill="#0f1316" stroke="#2c3238" rx="4"/><text x="96" y="152" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="17" letter-spacing="1">HOST</text><g fill="#b6bcc3" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="96" y="190">storage.r2</text><text x="256" y="190">database.d1</text><text x="428" y="190">auth.passkey</text><text x="600" y="190">admin.ui</text></g><g fill="#4fce8a"><circle cx="82" cy="184" r="3.5"/><circle cx="242" cy="184" r="3.5"/><circle cx="414" cy="184" r="3.5"/><circle cx="586" cy="184" r="3.5"/></g></g><g><rect width="316" height="204" x="72" y="300" fill="#0c0f12" stroke="#23272c" rx="4"/><rect width="316" height="204" x="412" y="300" fill="#0c0f12" stroke="#23272c" rx="4"/><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="96" y="336" fill="#f4f2ee">target: cloudflare</text><text x="436" y="336" fill="#f4f2ee">target: local sqlite</text></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><g fill="#4fce8a"><text x="96" y="378">✓ storage.r2</text><text x="96" y="412">✓ database.d1</text><text x="96" y="446">✓ auth.passkey</text><text x="96" y="480">✓ admin.ui</text></g><g><text x="436" y="378" fill="#4fce8a">✓ storage.local</text><text x="436" y="412" fill="#4fce8a">✓ database.sqlite</text><text x="436" y="446" fill="#4fce8a">✓ auth.dev-bypass</text><text x="436" y="480" fill="#f2a33c">△ admin.ui</text></g></g><text x="436" y="500" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="14">reduced here</text><path fill="none" stroke="#4fce8a" stroke-width="1.5" marker-end="url(#negok)" d="M232 232 V296"/><path fill="none" stroke="#f2a33c" stroke-width="1.5" marker-end="url(#negno)" d="M572 232 V296"/></g><g><rect width="656" height="238" x="72" y="556" fill="#0a0d10" stroke="#1e2429" rx="4"/><g fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="96" y="596">// what the plugin asks for, and what it does without each</text><text x="96" y="634" fill="#4cc2f0">requires</text><text x="200" y="634" fill="#d8dee4">storage.append, storage.read</text><text x="96" y="664" fill="#a68bfb">optional</text><text x="200" y="664" fill="#d8dee4">admin.panel</text><text x="392" y="664" fill="#6a7178">→ falls back to a settings link</text><text x="96" y="694" fill="#a68bfb">optional</text><text x="200" y="694" fill="#d8dee4">storage.versioning</text><text x="392" y="694" fill="#6a7178">→ content-hash paths instead</text><text x="96" y="724" fill="#ff8a4c">declines</text><text x="200" y="724" fill="#d8dee4">admin.rbac.readAll</text><text x="392" y="724" fill="#6a7178">→ authorises through the host</text></g><path stroke="#1c2126" d="M96 754 H704"/><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="96" y="782" fill="#4fce8a">feature never appears, so it can never be half-broken</text></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="856" fill="#f4f2ee">Installed is not the same as supported.</text><text x="72" y="890" fill="#6a7178">A capability the host cannot honour is removed from the surface,</text><text x="72" y="918" fill="#6a7178">not rendered and then allowed to fail at runtime.</text></g></svg>