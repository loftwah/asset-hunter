<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Silhouette legibility plate: character readability preserved with no interior detail" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="silbg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#1c2126"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#silbg)"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="70" fill="#ff5a1f" letter-spacing="2">READ AT 24 PIXELS</text><text x="72" y="90" fill="#6a7178">if the pose is unclear, the silhouette is wrong</text></g><g fill="#f4f2ee"><g><path d="M96 22 a17 20 0 1 1 0.1 0Z" transform="translate(96,150)"/><path d="M74 52 q28 -12 56 0 l16 74 q-44 16 -88 0Z" transform="translate(96,150)"/><path d="M66 132 q40 14 80 0 l8 66 q-48 14 -96 0Z" transform="translate(96,150)"/><path d="M62 204 q44 12 84 0 l4 46 q-46 12 -92 0Z" transform="translate(96,150)"/></g><g><path d="M100 18 a16 15 0 1 1 0.1 0Z" transform="translate(336,150)"/><path d="M76 42 q30 -10 58 2 l22 52 q-52 14 -102 0Z" transform="translate(336,150)"/><path d="M54 104 q56 18 112 0 l26 54 q-82 20 -164 0Z" transform="translate(336,150)"/><path d="M42 166 q74 20 142 0 l4 40 q-74 18 -148 0Z" transform="translate(336,150)"/></g><g opacity=".4"><path d="M100 24 a16 17 0 1 1 0.1 0Z" transform="translate(576,150)"/><path d="M72 52 q36 -8 60 4 l14 128 q-46 14 -90 0Z" transform="translate(576,150)"/><path d="M64 190 q40 12 78 0 l6 56 q-46 12 -90 0Z" transform="translate(576,150)"/></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="15"><text x="96" y="466" fill="#4fce8a">A · readable</text><text x="96" y="490" fill="#6a7178">limb gaps survive</text><text x="336" y="466" fill="#4fce8a">B · readable</text><text x="336" y="490" fill="#6a7178">weight low, stance wide</text><text x="576" y="466" fill="#ff8a4c">C · fails</text><text x="576" y="490" fill="#6a7178">one mass, no</text><text x="576" y="512" fill="#6a7178">articulation</text></g><g><path stroke="#1c2126" d="M72 540 H728"/><text x="72" y="580" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16">at 24px</text><g><path fill="#f4f2ee" d="M96 22 a17 20 0 1 1 0.1 0Z M74 52 q28 -12 56 0 l16 74 q-44 16 -88 0Z M66 132 q40 14 80 0 l8 66 q-48 14 -96 0Z M62 204 q44 12 84 0 l4 46 q-46 12 -92 0Z" transform="translate(120,596) scale(0.118)"/></g><g><path fill="#f4f2ee" d="M100 18 a16 15 0 1 1 0.1 0Z M76 42 q30 -10 58 2 l22 52 q-52 14 -102 0Z M54 104 q56 18 112 0 l26 54 q-82 20 -164 0Z M42 166 q74 20 142 0 l4 40 q-74 18 -148 0Z" transform="translate(300,596) scale(0.118)"/></g><g opacity=".4"><path fill="#f4f2ee" d="M100 24 a16 17 0 1 1 0.1 0Z M72 52 q36 -8 60 4 l14 128 q-46 14 -90 0Z M64 190 q40 12 78 0 l6 56 q-46 12 -90 0Z" transform="translate(480,596) scale(0.118)"/></g><text x="720" y="612" fill="#4d565f" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="end">gap ≥ 2px at 24px</text></g><g><rect width="328" height="180" x="72" y="700" fill="#0d1114" stroke="#1e2429" rx="3"/><g transform="translate(140,730)"><rect width="30" height="120" x="0" y="0" fill="#f4f2ee"/><rect width="30" height="120" x="52" y="0" fill="#f4f2ee"/><g stroke="#4cc2f0" stroke-width="1"><path d="M30 60 H52"/><path d="M30 54 V66 M52 54 V66"/></g><text x="41" y="146" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="14" text-anchor="middle">≥ 2px</text></g><text x="228" y="746" fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="15">minimum negative</text><text x="228" y="770" fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="15">space, enforced at</text><text x="228" y="794" fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="15">the smallest zoom</text></g><g><rect width="312" height="180" x="416" y="700" fill="#0d1114" stroke="#1e2429" rx="3"/><g font-family="ui-monospace,Menlo,monospace" font-size="15"><text x="440" y="746" fill="#4fce8a">design for the far case</text><text x="440" y="778" fill="#8b929a">detail is added by the</text><text x="440" y="802" fill="#8b929a">renderer when there is</text><text x="440" y="826" fill="#8b929a">room for it</text><text x="440" y="858" fill="#6a7178">never in the source pose</text></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><path stroke="#1c2126" d="M72 912 H728"/><text x="72" y="948" fill="#f4f2ee">Contrast against the background is also a pose decision.</text></g></svg>