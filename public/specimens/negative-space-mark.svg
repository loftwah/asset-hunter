<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Negative-space mark plate: two solid wedges whose shared diagonal is the mark" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><path fill="#f4f2ee" d="M2 -50 L46 -50 L24 50 L2 50 Z" transform="translate(400,300)"/><path fill="#ff5a1f" d="M98 -50 L54 -50 L76 50 L98 50 Z" transform="translate(400,300)"/></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="23" text-anchor="middle">two solids, and the gap between them is the figure</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><path fill="#f4f2ee" d="M2 -50 L46 -50 L24 50 L2 50 Z" transform="translate(190,712)"/><path fill="#ff5a1f" d="M98 -50 L54 -50 L76 50 L98 50 Z" transform="translate(190,712)"/></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><path fill="#f4f2ee" d="M2 -50 L46 -50 L24 50 L2 50 Z" transform="translate(400,724)"/><path fill="#ff5a1f" d="M98 -50 L54 -50 L76 50 L98 50 Z" transform="translate(400,724)"/></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><path fill="#f4f2ee" d="M2 -50 L46 -50 L24 50 L2 50 Z" transform="translate(610,734)"/><path fill="#ff5a1f" d="M98 -50 L54 -50 L76 50 L98 50 Z" transform="translate(610,734)"/></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="19">Nothing is drawn where the eye wants to see a shape.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="19">Flat, one ink, no outline needed to hold it together.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">holds: flat · reverse · one ink</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="17" text-anchor="end">breaks below 16px</text></svg>