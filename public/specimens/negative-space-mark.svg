<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Negative-space mark plate: two solid wedges whose shared diagonal is the mark">
	<defs>
		<radialGradient id="bg" cx="50%" cy="32%" r="74%">
			<stop offset="0%" stop-color="#1a1e22"/>
			<stop offset="100%" stop-color="#08090a"/>
		</radialGradient>
	</defs>
	<rect width="800" height="1000" fill="url(#bg)"/>

	<!-- The mark. This is the content; everything below is its evidence. -->
	<g transform="translate(400,300)">
		<path d="M2 -50 L46 -50 L24 50 L2 50 Z" fill="#f4f2ee"/>
		<path d="M98 -50 L54 -50 L76 50 L98 50 Z" fill="#ff5a1f"/></g>
	<text x="400" y="556" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="23" fill="#f4f2ee">two solids, and the gap between them is the figure</text>

	<path d="M96 600 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
	<text x="96" y="636" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">the same geometry, reduced</text>

<g transform="translate(190,712)">
		<path d="M2 -50 L46 -50 L24 50 L2 50 Z" fill="#f4f2ee"/>
		<path d="M98 -50 L54 -50 L76 50 L98 50 Z" fill="#ff5a1f"/></g>
	<text x="190" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">100px</text>
<g transform="translate(400,724)">
		<path d="M2 -50 L46 -50 L24 50 L2 50 Z" fill="#f4f2ee"/>
		<path d="M98 -50 L54 -50 L76 50 L98 50 Z" fill="#ff5a1f"/></g>
	<text x="400" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">58px</text>
<g transform="translate(610,734)">
		<path d="M2 -50 L46 -50 L24 50 L2 50 Z" fill="#f4f2ee"/>
		<path d="M98 -50 L54 -50 L76 50 L98 50 Z" fill="#ff5a1f"/></g>
	<text x="610" y="812" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#6a7178">32px</text>

	<path d="M96 846 H704" stroke="#2c3238" stroke-dasharray="2 6"/>
<text x="96" y="888" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#6a7178">Nothing is drawn where the eye wants to see a shape.</text>
<text x="96" y="920" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#4c545c">Flat, one ink, no outline needed to hold it together.</text>

	<path d="M96 958 H704" stroke="#1c2126"/>
	<text x="96" y="988" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">holds: flat · reverse · one ink</text>
	<text x="728" y="988" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#f2a33c">breaks below 16px</text>
</svg>
