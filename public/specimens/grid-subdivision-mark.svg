<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Grid subdivision mark plate: a diagonal of three cells taken from a three by three division" role="img" viewBox="0 0 800 1000"><defs><radialGradient id="bg" cx="50%" cy="32%" r="74%"><stop offset="0%" stop-color="#1a1e22"/><stop offset="100%" stop-color="#08090a"/></radialGradient></defs><rect width="800" height="1000" fill="url(#bg)"/><g><g fill="none" stroke="#4cc2f0" stroke-width="2.56" opacity=".45"><path d="M-106.66666666666669 0 H106.66666666666669 M0 -106.66666666666669 V106.66666666666669" transform="translate(400,300)"/><path d="M106.66666666666669 0 H320.00000000000006 M0 106.66666666666669 V320.00000000000006" transform="translate(400,300)"/></g><g fill="#ff5a1f" transform="translate(400,300)"><rect width="106.667" height="106.667" x="-106.667" y="-106.667"/><rect width="106.667" height="106.667" x="0" y="0"/><rect width="106.667" height="106.667" x="106.667" y="106.667"/></g></g><text x="400" y="556" fill="#f4f2ee" font-family="ui-monospace,Menlo,monospace" font-size="20" text-anchor="middle">3 × 3, and nothing drawn that is not already on the grid</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 600 H704"/><text x="96" y="636" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17">the same geometry, reduced</text><g><g fill="none" stroke="#4cc2f0" stroke-width=".8" opacity=".45"><path d="M-33.333333333333336 0 H33.333333333333336 M0 -33.333333333333336 V33.333333333333336" transform="translate(190,712)"/><path d="M33.333333333333336 0 H100 M0 33.333333333333336 V100" transform="translate(190,712)"/></g><g fill="#ff5a1f" transform="translate(190,712)"><rect width="33.333" height="33.333" x="-33.333" y="-33.333"/><rect width="33.333" height="33.333" x="0" y="0"/><rect width="33.333" height="33.333" x="33.333" y="33.333"/></g></g><text x="190" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">100px</text><g><g fill="none" stroke="#4cc2f0" stroke-width=".464" opacity=".45"><path d="M-19.333333333333332 0 H19.333333333333332 M0 -19.333333333333332 V19.333333333333332" transform="translate(400,724)"/><path d="M19.333333333333332 0 H58 M0 19.333333333333332 V58" transform="translate(400,724)"/></g><g fill="#ff5a1f" transform="translate(400,724)"><rect width="19.333" height="19.333" x="-19.333" y="-19.333"/><rect width="19.333" height="19.333" x="0" y="0"/><rect width="19.333" height="19.333" x="19.333" y="19.333"/></g></g><text x="400" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">58px</text><g><g fill="none" stroke="#4cc2f0" stroke-width=".256" opacity=".45"><path d="M-10.666666666666668 0 H10.666666666666668 M0 -10.666666666666668 V10.666666666666668" transform="translate(610,734)"/><path d="M10.666666666666668 0 H32 M0 10.666666666666668 V32" transform="translate(610,734)"/></g><g fill="#ff5a1f" transform="translate(610,734)"><rect width="10.667" height="10.667" x="-10.667" y="-10.667"/><rect width="10.667" height="10.667" x="0" y="0"/><rect width="10.667" height="10.667" x="10.667" y="10.667"/></g></g><text x="610" y="812" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16" text-anchor="middle">32px</text><path stroke="#2c3238" stroke-dasharray="2 6" d="M96 846 H704"/><text x="96" y="888" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16">The diagonal is the identity; the cells are how you got there.</text><text x="96" y="920" fill="#4c545c" font-family="ui-monospace,Menlo,monospace" font-size="18">Ship the rule, not the file, and the mark cannot drift.</text><path stroke="#1c2126" d="M96 958 H704"/><text x="96" y="988" fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="16">holds: one grid · flat · reverse</text><text x="728" y="988" fill="#f2a33c" font-family="ui-monospace,Menlo,monospace" font-size="17" text-anchor="end">breaks: rule as drawing</text></svg>