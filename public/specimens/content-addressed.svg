<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-label="Content-addressed pipeline plate: assets identified by their bytes so derivatives are verifiable and dedupe exactly" role="img" viewBox="0 0 800 1000"><defs><marker id="capArrow" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="3.5"><path fill="#4cc2f0" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs><rect width="800" height="1000" fill="#08090a"/><g fill="#6a7178" font-family="ui-monospace,Menlo,monospace" font-size="17"><text x="72" y="72" fill="#ff5a1f" letter-spacing="2">THE NAME IS THE PROOF</text><text x="72" y="92" fill="#6a7178">dedupe and verification for free, by construction</text></g><g><rect width="180" height="88" x="72" y="120" fill="#101418" stroke="#23272c" rx="3"/><g fill="#8b929a" font-family="ui-monospace,Menlo,monospace" font-size="15"><text x="88" y="152">hero@2x.png</text><text x="88" y="178" fill="#6a7178">2 481 993 B</text><text x="88" y="198" fill="#6a7178">sha256 · 64 hex</text></g></g><path fill="none" stroke="#4cc2f0" stroke-width="1.5" marker-end="url(#capArrow)" d="M256 164 H318"/><g><rect width="404" height="120" x="324" y="104" fill="#0c1418" stroke="#4cc2f0" stroke-opacity=".4" rx="3"/><text x="344" y="140" fill="#4cc2f0" font-family="ui-monospace,Menlo,monospace" font-size="15" letter-spacing="1">SHA-256</text><g fill="#d8dee4" font-family="ui-monospace,Menlo,monospace" font-size="19"><text x="344" y="176">9f2c 41ab 77e0 5d13</text><text x="344" y="202" fill="#8b929a">c608 5a3e 1b77 f0d2 4e91</text></g></g><g><path fill="none" stroke="#4cc2f0" stroke-width="1.5" d="M526 232 V268"/><path fill="none" stroke="#4cc2f0" stroke-width="1.5" d="M180 268 H672"/><g fill="none" stroke="#4cc2f0" stroke-width="1.5"><path marker-end="url(#capArrow)" d="M180 268 V296"/><path marker-end="url(#capArrow)" d="M344 268 V296"/><path marker-end="url(#capArrow)" d="M526 268 V296"/><path marker-end="url(#capArrow)" d="M672 268 V296"/></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="15"><g><rect width="180" height="128" x="72" y="304" fill="#101418" stroke="#23272c" rx="3"/><text x="88" y="336" fill="#4fce8a">hero.png</text><text x="88" y="362" fill="#8b929a">identical bytes</text><text x="88" y="386" fill="#6a7178">→ dedupe hit</text><text x="88" y="410" fill="#6a7178">1 object stored</text></g><g><rect width="180" height="128" x="236" y="304" fill="#101418" stroke="#23272c" rx="3"/><text x="252" y="336" fill="#d8dee4">hero.webp</text><text x="252" y="362" fill="#8b929a">different bytes</text><text x="252" y="386" fill="#6a7178">→ new address</text><text x="252" y="410" fill="#6a7178">parent recorded</text></g><g><rect width="180" height="128" x="400" y="304" fill="#101418" stroke="#23272c" rx="3"/><text x="416" y="336" fill="#f2a33c">hero.recolor.png</text><text x="416" y="362" fill="#8b929a">derived work</text><text x="416" y="386" fill="#6a7178">→ own address</text><text x="416" y="410" fill="#f2a33c">parent kept</text></g><g><rect width="164" height="128" x="564" y="304" fill="#101418" stroke="#23272c" rx="3"/><text x="580" y="336" fill="#ff8a4c">remote.ttf</text><text x="580" y="362" fill="#8b929a">from elsewhere</text><text x="580" y="386" fill="#6a7178">→ same name?</text><text x="580" y="410" fill="#4fce8a">different bytes</text></g></g><g><rect width="656" height="176" x="72" y="480" fill="#0a0d10" stroke="#1e2429" rx="3"/><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="96" y="518" fill="#4fce8a">originals are immutable</text><text x="96" y="548" fill="#4fce8a">derivatives are separately identifiable</text><text x="96" y="578" fill="#4fce8a">identical bytes cannot be stored twice</text><text x="96" y="608" fill="#4fce8a">a provenance chain is a list of addresses</text><text x="96" y="638" fill="#6a7178">and a verifier can recompute the whole chain offline</text></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><text x="72" y="706" fill="#6a7178">visible as</text><g fill="#8b929a"><text x="72" y="742">· the same asset found twice is one catalogue entry with two sources</text><text x="72" y="776">· &quot;derived&quot; and &quot;generated&quot; examples carry their parent address</text><text x="72" y="810">· a licence correction rewrites the record, never the bytes</text></g></g><g font-family="ui-monospace,Menlo,monospace" font-size="16"><path stroke="#1c2126" d="M72 848 H728"/><text x="72" y="884" fill="#f4f2ee">Hashing the bytes is what makes the promise checkable.</text><text x="72" y="916" fill="#6a7178">A filename cannot promise anything.</text></g></svg>