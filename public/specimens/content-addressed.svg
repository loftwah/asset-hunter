<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Content-addressed pipeline plate: assets identified by their bytes so derivatives are verifiable and dedupe exactly">
	<defs>
		<marker id="capArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
			<path d="M0 0 L7 3.5 L0 7 Z" fill="#4cc2f0"/>
		</marker>
	</defs>
	<rect width="800" height="1000" fill="#08090a"/>

	<g font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6a7178">
		<text x="72" y="72" fill="#ff5a1f" letter-spacing="2">THE NAME IS THE PROOF</text>
		<text x="72" y="92" fill="#6a7178">dedupe and verification for free, by construction</text>
	</g>

	<!-- original bytes in -->
	<g>
		<rect x="72" y="120" width="180" height="88" rx="3" fill="#101418" stroke="#23272c"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b929a">
			<text x="88" y="152">hero@2x.png</text>
			<text x="88" y="178" fill="#6a7178">2 481 993 B</text>
			<text x="88" y="198" fill="#6a7178">sha256 · 64 hex</text>
		</g>
	</g>
	<path d="M256 164 H318" stroke="#4cc2f0" stroke-width="1.5" fill="none" marker-end="url(#capArrow)"/>

	<!-- hash: the identity -->
	<g>
		<rect x="324" y="104" width="404" height="120" rx="3" fill="#0c1418" stroke="#4cc2f0" stroke-opacity=".4"/>
		<text x="344" y="140" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#4cc2f0" letter-spacing="1">SHA-256</text>
		<g font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#d8dee4">
			<text x="344" y="176">9f2c 41ab 77e0 5d13</text>
			<text x="344" y="202" fill="#8b929a">c608 5a3e 1b77 f0d2 4e91</text>
		</g>
	</g>

	<!-- fan out: every derivative records its parent, never overwrites it -->
	<g>
		<path d="M526 232 V268" stroke="#4cc2f0" stroke-width="1.5" fill="none"/>
		<path d="M180 268 H672" stroke="#4cc2f0" stroke-width="1.5" fill="none"/>
		<g stroke="#4cc2f0" stroke-width="1.5" fill="none">
			<path d="M180 268 V296" marker-end="url(#capArrow)"/>
			<path d="M344 268 V296" marker-end="url(#capArrow)"/>
			<path d="M526 268 V296" marker-end="url(#capArrow)"/>
			<path d="M672 268 V296" marker-end="url(#capArrow)"/>
		</g>
	</g>

	<g font-family="ui-monospace,Menlo,monospace" font-size="15">
		<!-- derivative 1: same bytes -->
		<g>
			<rect x="72" y="304" width="180" height="128" rx="3" fill="#101418" stroke="#23272c"/>
			<text x="88" y="336" fill="#4fce8a">hero.png</text>
			<text x="88" y="362" fill="#8b929a">identical bytes</text>
			<text x="88" y="386" fill="#6a7178">→ dedupe hit</text>
			<text x="88" y="410" fill="#6a7178">1 object stored</text>
		</g>
		<!-- derivative 2: re-encoded -->
		<g>
			<rect x="236" y="304" width="180" height="128" rx="3" fill="#101418" stroke="#23272c"/>
			<text x="252" y="336" fill="#d8dee4">hero.webp</text>
			<text x="252" y="362" fill="#8b929a">different bytes</text>
			<text x="252" y="386" fill="#6a7178">→ new address</text>
			<text x="252" y="410" fill="#6a7178">parent recorded</text>
		</g>
		<!-- derivative 3: the risky one -->
		<g>
			<rect x="400" y="304" width="180" height="128" rx="3" fill="#101418" stroke="#23272c"/>
			<text x="416" y="336" fill="#f2a33c">hero.recolor.png</text>
			<text x="416" y="362" fill="#8b929a">derived work</text>
			<text x="416" y="386" fill="#6a7178">→ own address</text>
			<text x="416" y="410" fill="#f2a33c">parent kept</text>
		</g>
		<!-- derivative 4: the hostile one -->
		<g>
			<rect x="564" y="304" width="164" height="128" rx="3" fill="#101418" stroke="#23272c"/>
			<text x="580" y="336" fill="#ff8a4c">remote.ttf</text>
			<text x="580" y="362" fill="#8b929a">from elsewhere</text>
			<text x="580" y="386" fill="#6a7178">→ same name?</text>
			<text x="580" y="410" fill="#4fce8a">different bytes</text>
		</g>
	</g>

	<!-- the guarantee, written out -->
	<g>
		<rect x="72" y="480" width="656" height="176" rx="3" fill="#0a0d10" stroke="#1e2429"/>
		<g font-family="ui-monospace,Menlo,monospace" font-size="16">
			<text x="96" y="518" fill="#4fce8a">originals are immutable</text>
			<text x="96" y="548" fill="#4fce8a">derivatives are separately identifiable</text>
			<text x="96" y="578" fill="#4fce8a">identical bytes cannot be stored twice</text>
			<text x="96" y="608" fill="#4fce8a">a provenance chain is a list of addresses</text>
			<text x="96" y="638" fill="#6a7178">and a verifier can recompute the whole chain offline</text>
		</g>
	</g>

	<!-- where this shows up in the product -->
	<g font-family="ui-monospace,Menlo,monospace" font-size="16">
		<text x="72" y="706" fill="#6a7178">visible as</text>
		<g fill="#8b929a">
			<text x="72" y="742">· the same asset found twice is one catalogue entry with two sources</text>
			<text x="72" y="776">· "derived" and "generated" examples carry their parent address</text>
			<text x="72" y="810">· a licence correction rewrites the record, never the bytes</text>
		</g>
	</g>

	<g font-family="ui-monospace,Menlo,monospace" font-size="16">
		<path d="M72 848 H728" stroke="#1c2126"/>
		<text x="72" y="884" fill="#f4f2ee">Hashing the bytes is what makes the promise checkable.</text>
		<text x="72" y="916" fill="#6a7178">A filename cannot promise anything.</text>
	</g>
</svg>
